name: 'Bootc Debs Start'
description: 'Checkout and prepare the workspace for building bootc debs. The build toolchain is baked into the per-repo :buildenv image the build jobs run in (see the build-env workflow), so nothing is installed here.'

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Prepare environement
      shell: bash
      run: |
        cp -r ./workflows/bootc-debs-builder/preinstall/* /
        mkdir -p /{build,debs}
