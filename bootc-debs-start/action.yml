name: 'Bootc Debs Start'
description: 'Setup environment for building bootc debs (install deps, checkout, prepare, install build deps, checkout CI tools, install yq)'

runs:
  using: 'composite'
  steps:
    - name: Install clone deps
      shell: bash
      run: |
        apt update
        apt install -y \
          ca-certificates \
          openssl \
          git \
          curl \
          wget

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Prepare environement
      shell: bash
      run: |
        cp -r ./workflows/bootc-debs-builder/preinstall/* /
        mkdir -p /{build,debs}

    - name: Install build deps
      shell: bash
      env:
        CARGO_HOME: "/build/rust"
        RUSTUP_HOME: "/build/rust"
        PVE_GPG_SHA256: 136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
      run: |
        # Proxmox archive keyring — harmless on repos that do not use the
        # proxmox sources: the keyring file is installed but never referenced
        # unless a proxmox sources.list.d entry is shipped in preinstall/.
        curl -fsSL https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg \
          -o /usr/share/keyrings/proxmox-archive-keyring.gpg
        printf '%s  /usr/share/keyrings/proxmox-archive-keyring.gpg\n' "${PVE_GPG_SHA256}" \
          | sha256sum -c -

        apt update
        apt install -y \
          zstd \
          make \
          build-essential \
          go-md2man \
          libzstd-dev \
          pkgconf \
          autoconf \
          automake \
          libtool \
          libglib2.0-dev \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libarchive-dev \
          libmount-dev \
          libfuse3-dev \
          libssl-dev \
          libsystemd-dev \
          gobject-introspection \
          libgirepository1.0-dev \
          libsoup-3.0-dev \
          bison \
          gperf \
          flex \
          gettext \
          python3 \
          autopoint \
          gawk \
          meson \
          ninja-build \
          libfreetype6-dev \
          sbsigntool

        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- --profile minimal -y