name: Build one bootc .deb

# Builds a single package from the caller repo's packages.yml manifest and
# uploads its .deb(s) as the artifact debs-<package>. Called once per package
# (via a matrix) by the generic bootc-debs-builder workflow. A package that
# declares deps first downloads and installs those deps' debs (built in an
# earlier wave) so its build can link against them.

on:
  workflow_call:
    inputs:
      package:
        description: 'Package name as it appears in the manifest.'
        required: true
        type: string
      manifest:
        description: 'Path to the package manifest in the caller repo.'
        required: false
        type: string
        default: workflows/bootc-debs-builder/packages.yml
      container_image:
        description: 'Pre-baked build-env image the job runs in (ghcr :buildenv tag).'
        required: true
        type: string
      arch:
        description: 'Target architecture (amd64 or arm64). Selects the yq binary variant and is forwarded to build-deb for deb naming.'
        required: false
        type: string
        default: amd64

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_PKG }}
    permissions:
      contents: read
      # The Delete old artifacts step calls gh api DELETE on actions/artifacts,
      # which requires the actions: write scope on GITHUB_TOKEN.
      actions: write
      # Some guarded repack builds open a "patch drift" issue on skip.
      issues: write
    env:
      # Secret values a package may pull in via its manifest secret-env. A
      # secret absent from this repo resolves to an empty string (harmless).
      SECRETVAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SECRETVAL_SB_SIGNING_KEY: ${{ secrets.SB_SIGNING_KEY }}
      SECRETVAL_SB_SIGNING_CERT: ${{ secrets.SB_SIGNING_CERT }}
      # Target arch propagates to the build-deb action and to deb globbing.
      BUILD_ARCH: ${{ inputs.arch }}
    steps:
      - uses: DaemonCores/DaemonCores-CI/bootc-debs-start@main

      - name: Read package definition
        id: def
        shell: bash
        env:
          MAN: ${{ inputs.manifest }}
          PKG: ${{ inputs.package }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || {
            # Arch-aware yq download: pick the binary matching the target arch
            # (amd64 or arm64). Falls back to the host arch when ARCH is unset.
            yarch="${ARCH:-$(dpkg --print-architecture 2>/dev/null || uname -m)}"
            case "$yarch" in
              aarch64) yarch=arm64 ;;
              x86_64)  yarch=amd64 ;;
            esac
            # Pin yq to a fixed version and verify the SHA256 checksum so a
            # compromised or tampered release cannot replace the binary
            # silently. Downloading from releases/latest/download/ with no
            # checksum lets a upstream-tagged malicious binary run as root
            # in the build container.
            YQ_VERSION="v4.44.3"
            YQ_BINARY="yq_linux_${yarch}"
            case "$yarch" in
              amd64)
                YQ_SHA256="a2c097580dd72e8fd5033837c5652c1f94dc1864ae9a6e2163f7c6c603b9d826"
                ;;
              arm64)
                YQ_SHA256="0f9f6f9fdb51d2cddb1be8ba4c00c4dd5316064c8a8b12e3e9e8bb8ad6d1e242"
                ;;
              *)
                echo "ERROR: unsupported yq arch: ${yarch}" >&2
                exit 1
                ;;
            esac
            curl -fsSL \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" \
              -o /usr/local/bin/yq
            echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
            chmod +x /usr/local/bin/yq
          }
          sel=".packages[] | select(.name == \"${PKG}\")"
          {
            echo "upstream=$(yq "${sel} | .upstream // \"\"" "${MAN}")"
            echo "deb_glob=$(yq "${sel} | .\"deb-glob\" // \"\"" "${MAN}")"
            echo "deps=$(yq "${sel} | (.deps // []) | .[]" "${MAN}" \
              | paste -sd' ' -)"
            # sources are stored relative to the manifest dir; make them
            # workspace-relative for build-deb.
            echo "sources=$(yq "${sel} | .sources[]" "${MAN}" \
              | sed 's#^#workflows/bootc-debs-builder/#' | paste -sd' ' -)"
          } >>"$GITHUB_OUTPUT"
          # env = non-secret KEY=VALUE lines, then resolved secret-env lines.
          envlines=$(yq "${sel} | (.env // {}) | to_entries | .[] \
            | .key + \"=\" + .value" "${MAN}")
          while IFS= read -r pair; do
            [ -n "${pair}" ] || continue
            key="${pair%%=*}"
            ref="SECRETVAL_${pair#*=}"
            val="${!ref}"
            # Mask the resolved secret value BEFORE it can appear in any log
            # output (the build-deb action logs its `env` input, and the value
            # is also written to $GITHUB_OUTPUT below). ::add-mask:: must be
            # emitted before the value is referenced anywhere visible.
            echo "::add-mask::${val}"
            envlines="${envlines}"$'\n'"${key}=${val}"
          done < <(yq "${sel} | (.\"secret-env\" // {}) | to_entries | .[] \
            | .key + \"=\" + .value" "${MAN}")
          {
            echo "env<<ENV_EOF"
            printf '%s\n' "${envlines}"
            echo "ENV_EOF"
            echo "build<<BUILD_EOF"
            yq "${sel} | .build" "${MAN}"
            echo "BUILD_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Fetch dependency debs
        if: steps.def.outputs.deps != ''
        uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          merge-multiple: true
          path: /tmp/prior

      - name: Install dependency debs
        if: steps.def.outputs.deps != ''
        shell: bash
        env:
          MAN: ${{ inputs.manifest }}
          DEPS: ${{ steps.def.outputs.deps }}
        run: |
          set -euo pipefail
          apt-get update
          # Transitive closure of deps: a dep's own .deb may depend on ITS deps
          # (libostree depends on libcomposefs), so collect the whole chain and
          # install it in one apt call, letting apt resolve the links.
          declare -A seen
          read -ra queue <<<"${DEPS}"
          debs=""
          while [ "${#queue[@]}" -gt 0 ]; do
            dep="${queue[0]}"
            queue=("${queue[@]:1}")
            [ -n "${seen[$dep]:-}" ] && continue
            seen[$dep]=1
            glob=$(yq ".packages[] | select(.name == \"${dep}\") \
              | .\"deb-glob\" // \"${dep}_*\"" "${MAN}")
            debs="${debs} /tmp/prior/${glob}.deb"
            while IFS= read -r sub; do
              [ -n "${sub}" ] && queue+=("${sub}")
            done < <(yq ".packages[] | select(.name == \"${dep}\") \
              | (.deps // []) | .[]" "${MAN}")
          done
          # Intentional split + glob of the collected local deb paths.
          # shellcheck disable=SC2086
          apt-get install -y ${debs}

      - name: Build ${{ inputs.package }}
        id: build
        uses: DaemonCores/DaemonCores-CI/build-deb@main
        with:
          package: ${{ inputs.package }}
          upstream: ${{ steps.def.outputs.upstream }}
          sources: ${{ steps.def.outputs.sources }}
          deb-glob: ${{ steps.def.outputs.deb_glob }}
          env: ${{ steps.def.outputs.env }}
          build: ${{ steps.def.outputs.build }}
          arch: ${{ inputs.arch }}

      # The build failed but the last-good published deb was kept, so the
      # pipeline is not blocked. Record the breakage as an issue (deduped by
      # title). gh is absent in the build container, so use the REST API.
      - name: Flag broken build
        if: steps.build.outputs.build_failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          title="⚠️ Build cassé : ${PKG} (dernier .deb valide conservé)"
          body=$(printf '%s' \
            "Le build de \`${PKG}\` a échoué (compilation ou check de contenu " \
            "post-patch). Le dernier .deb publié a été réutilisé pour ne pas " \
            "casser la prod, et le hash de cache est laissé inchangé (le fix " \
            "sera re-tenté au prochain run). Run : " \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json")
          num=$(curl -fsSL "${auth[@]}" "${api}/issues?state=open&per_page=100" \
            | jq -r --arg t "${title}" \
              'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "${num}" ]; then
            curl -fsSL "${auth[@]}" -X POST "${api}/issues/${num}/comments" \
              -d "$(jq -n --arg b "${body}" '{body: $b}')" >/dev/null
          else
            curl -fsSL "${auth[@]}" -X POST "${api}/issues" \
              -d "$(jq -n --arg t "${title}" --arg b "${body}" \
                '{title: $t, body: $b}')" >/dev/null
          fi
          echo "::warning::${PKG} build cassé — issue ouverte/mise à jour," \
            "dernier .deb valide conservé"

      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="debs-${{ inputs.package }}-${{ inputs.arch }}"
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${artifact_name}" --jq '.artifacts[].id')
          for id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload ${{ inputs.package }} debs
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ inputs.package }}-${{ inputs.arch }}
          path: /debs
          include-hidden-files: true
