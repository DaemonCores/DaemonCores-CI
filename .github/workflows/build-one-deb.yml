name: Build one bootc .deb

# Builds a single package from the caller repo's packages.yml manifest and
# uploads its .deb(s) as the artifact debs-<package>. Called once per package
# (via a matrix) by the generic bootc-debs-builder workflow. A package that
# declares deps first downloads and installs those deps' debs (built in an
# earlier wave) so its build can link against them.

on:
  workflow_call:
    inputs:
      package:
        description: 'Package name as it appears in the manifest.'
        required: true
        type: string
      manifest:
        description: 'Path to the package manifest in the caller repo.'
        required: false
        type: string
        default: workflows/bootc-debs-builder/packages.yml
      container_image:
        description: 'Pre-baked build-env image the job runs in (ghcr :buildenv tag).'
        required: true
        type: string
      arch:
        description: 'Target architecture (amd64 or arm64). Selects the yq binary variant and is forwarded to build-deb for deb naming.'
        required: false
        type: string
        default: amd64
      signing_active:
        description: 'yes to sign .ko files with MODULE_SIGNING_KEY/CERT secrets; empty/no to skip.'
        required: false
        type: string
        default: 'no'

jobs:
  build:
    # The package name, so a wave matrix lists its jobs by package instead of
    # as a column of identical "build" entries.
    name: ${{ inputs.package }}
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_PKG || github.token }}
    permissions:
      contents: read
      # Pull the private build-env image with the job token when PAT_PKG is unset.
      packages: read
      # The Delete old artifacts step calls gh api DELETE on actions/artifacts,
      # which requires the actions: write scope on GITHUB_TOKEN.
      actions: write
      # Some guarded repack builds open a "patch drift" issue on skip.
      issues: write
    env:
      # Secret values a package may pull in via its manifest secret-env. A
      # secret absent from this repo resolves to an empty string (harmless).
      SECRETVAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SECRETVAL_SB_SIGNING_KEY: ${{ secrets.SB_SIGNING_KEY }}
      SECRETVAL_SB_SIGNING_CERT: ${{ secrets.SB_SIGNING_CERT }}
      # Module signing key/cert — available to all module build scripts when
      # signing_active=yes. Injected here so no manifest secret-env change is
      # needed; the build script checks MODULE_SIGNING_ACTIVE before using them.
      MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
      MODULE_SIGNING_CERT: ${{ secrets.MODULE_SIGNING_CERT }}
      # Target arch propagates to the build-deb action and to deb globbing.
      BUILD_ARCH: ${{ inputs.arch }}
    steps:
      - uses: DaemonCores/DaemonCores-CI/bootc-debs-start@main

      # Expand any `variants:` template into plain packages before the lookup
      # below. A variant-generated name (e.g. linux-modules-rpi3) does not exist
      # as a literal entry in the source manifest, so the select() in "Read
      # package definition" would find nothing.
      - name: Expand manifest variants
        id: expand
        uses: DaemonCores/DaemonCores-CI/manifest-expand@main
        with:
          manifest: ${{ inputs.manifest }}

      - name: Read package definition
        id: def
        shell: bash
        env:
          MAN: ${{ steps.expand.outputs.manifest }}
          PKG: ${{ inputs.package }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null 2>&1 || {
            # Arch-aware yq download: pick the binary matching the target arch
            # (amd64 or arm64). Falls back to the host arch when ARCH is unset.
            yarch="${ARCH:-$(dpkg --print-architecture 2>/dev/null || uname -m)}"
            case "$yarch" in
              aarch64) yarch=arm64 ;;
              x86_64)  yarch=amd64 ;;
            esac
            # Pin yq to a fixed version and verify the SHA256 checksum so a
            # compromised or tampered release cannot replace the binary
            # silently. Downloading from releases/latest/download/ with no
            # checksum lets a upstream-tagged malicious binary run as root
            # in the build container.
            YQ_VERSION="v4.44.3"
            YQ_BINARY="yq_linux_${yarch}"
            case "$yarch" in
              amd64)
                YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
                ;;
              arm64)
                YQ_SHA256="0e7e1524f68d91b3ff9b089872d185940ab0fa020a5a9052046ef10547023156"
                ;;
              *)
                echo "ERROR: unsupported yq arch: ${yarch}" >&2
                exit 1
                ;;
            esac
            curl -fsSL \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}" \
              -o /usr/local/bin/yq
            echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
            chmod +x /usr/local/bin/yq
          }
          sel=".packages[] | select(.name == \"${PKG}\")"
          {
            echo "upstream=$(yq "${sel} | .upstream // \"\"" "${MAN}")"
            echo "deb_glob=$(yq "${sel} | .\"deb-glob\" // \"\"" "${MAN}")"
            echo "deps=$(yq "${sel} | (.deps // []) | .[]" "${MAN}" \
              | paste -sd' ' -)"
            # sources are stored relative to the manifest dir; make them
            # workspace-relative for build-deb.
            echo "sources=$(yq "${sel} | .sources[]" "${MAN}" \
              | sed 's#^#workflows/bootc-debs-builder/#' | paste -sd' ' -)"
            # A package compiling the kernel declares `ccache: true`: its object
            # cache is restored/saved across runs (see "Enable ccache").
            if [ "$(yq "${sel} | .ccache // false" "${MAN}")" = true ]; then
              echo "ccache=yes"
            else
              echo "ccache=no"
            fi
            # Only a package built with lib/kernel-signing.sh depends on the
            # signing flag, so only its content hash may carry it.
            if yq "${sel} | .sources[]" "${MAN}" \
              | grep -qx 'lib/kernel-signing.sh'; then
              echo "signs=yes"
            else
              echo "signs=no"
            fi
          } >>"$GITHUB_OUTPUT"
          # env = non-secret KEY=VALUE lines, then resolved secret-env lines.
          envlines=$(yq "${sel} | (.env // {}) | to_entries | .[] \
            | .key + \"=\" + .value" "${MAN}")
          # Native patch data (Gabriel, 30/10/2026): an entry may carry a
          # `patches:` key — the canonical declarative patch schema (same
          # structure as a patches.yml file), as compact one-line JSON in
          # PATCHES_JSON. It rides in EXTRA_ENV: exported for the build AND
          # hashed into the content hash (non-secret). The kernel helper
          # reads it as first-class data; a patches.yml file path stays
          # equally supported.
          patches_json=$(yq "${sel} | (.patches // []) | select(length > 0)" \
            -o=json -I=0 "${MAN}")
          if [ "${patches_json}" != "[]" ] && [ -n "${patches_json}" ]; then
            envlines="${envlines}"$'\n'"PATCHES_JSON=${patches_json}"
          fi
          while IFS= read -r pair; do
            [ -n "${pair}" ] || continue
            key="${pair%%=*}"
            ref="SECRETVAL_${pair#*=}"
            val="${!ref}"
            # Mask the resolved secret value BEFORE it can appear in any log
            # output (the build-deb action logs its `env` input, and the value
            # is also written to $GITHUB_OUTPUT below). ::add-mask:: must be
            # emitted before the value is referenced anywhere visible.
            echo "::add-mask::${val}"
            envlines="${envlines}"$'\n'"${key}=${val}"
          done < <(yq "${sel} | (.\"secret-env\" // {}) | to_entries | .[] \
            | .key + \"=\" + .value" "${MAN}")
          {
            echo "env<<ENV_EOF"
            printf '%s\n' "${envlines}"
            echo "ENV_EOF"
            echo "build<<BUILD_EOF"
            yq "${sel} | .build" "${MAN}"
            echo "BUILD_EOF"
          } >>"$GITHUB_OUTPUT"

      # Compiler cache for the kernel builds: the objects of the image, its
      # -16k variant and the device modules overlap heavily, and a new kernel
      # release changes few files. The compiler is masqueraded through
      # /usr/lib/ccache so no make line changes. CCACHE_BASEDIR makes the hash
      # independent of the versioned source directory (/tmp/linux-<version>).
      # The cache is not a build input: it never enters the content hash.
      - name: Enable ccache
        if: steps.def.outputs.ccache == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ccache
          mkdir -p /ccache
          echo /usr/lib/ccache >>"$GITHUB_PATH"
          {
            echo "CCACHE_DIR=/ccache"
            echo "CCACHE_BASEDIR=/tmp"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=2G"
          } >>"$GITHUB_ENV"

      - name: Restore ccache
        if: steps.def.outputs.ccache == 'yes'
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ inputs.arch }}-${{ inputs.package }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.arch }}-${{ inputs.package }}-
            ccache-${{ inputs.arch }}-

      - name: Fetch dependency debs
        if: steps.def.outputs.deps != ''
        uses: actions/download-artifact@v8
        with:
          # Scope to this arch only: both amd64 and arm64 artifacts are present
          # in the run (from the parallel wave jobs). Without the arch suffix,
          # merge-multiple would land both libcomposefs_*_amd64.deb and
          # libcomposefs_*_arm64.deb in /tmp/prior, causing a multi-arch
          # Conflicts error when apt tries to install them together.
          pattern: debs-*-${{ inputs.arch }}
          merge-multiple: true
          path: /tmp/prior

      - name: Install dependency debs
        id: depdebs
        if: steps.def.outputs.deps != ''
        shell: bash
        env:
          MAN: ${{ steps.expand.outputs.manifest }}
          DEPS: ${{ steps.def.outputs.deps }}
        run: |
          set -euo pipefail
          apt-get update
          # Transitive closure of deps: a dep's own .deb may depend on ITS deps
          # (libostree depends on libcomposefs), so collect the whole chain and
          # install it in one apt call, letting apt resolve the links.
          declare -A seen
          read -ra queue <<<"${DEPS}"
          debs=""
          while [ "${#queue[@]}" -gt 0 ]; do
            dep="${queue[0]}"
            queue=("${queue[@]:1}")
            [ -n "${seen[$dep]:-}" ] && continue
            seen[$dep]=1
            glob=$(yq ".packages[] | select(.name == \"${dep}\") \
              | .\"deb-glob\" // \"${dep}_*\"" "${MAN}")
            debs="${debs} /tmp/prior/${glob}.deb"
            while IFS= read -r sub; do
              [ -n "${sub}" ] && queue+=("${sub}")
            done < <(yq ".packages[] | select(.name == \"${dep}\") \
              | (.deps // []) | .[]" "${MAN}")
          done
          # Intentional split + glob of the collected local deb paths.
          # shellcheck disable=SC2086
          apt-get install -y ${debs}
          # Identity of the dependency debs this build really consumes. The
          # content hash only saw the tracked upstream version, so a package
          # built against a last-good dep (its newer build had failed) kept
          # that hash after the dep caught up and was then reused with a stale
          # `Depends` pin. The digest of the installed debs is hashed too.
          echo "hash=$(sha256sum ${debs} | awk '{ print $1 }' | sort \
            | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      # Rolling release: a package that lists `track:` in the manifest builds
      # the latest upstream release (version + asset checksums resolved here),
      # not a version committed in the repository.  The resolved values feed the
      # content hash, so a new release rebuilds; if the new release does not
      # build, build-deb keeps the last-good published deb.
      - name: Track upstream releases
        id: track
        uses: DaemonCores/DaemonCores-CI/upstream-track@main
        with:
          package: ${{ inputs.package }}
          manifest: ${{ steps.expand.outputs.manifest }}
          source-manifest: ${{ inputs.manifest }}
          env: ${{ steps.def.outputs.env }}
          token: ${{ github.token }}

      - name: Compose hashed build env
        id: hashenv
        shell: bash
        env:
          SIGNS: ${{ steps.def.outputs.signs }}
          SIGNING_ACTIVE: ${{ inputs.signing_active }}
          DEPS_HASH: ${{ steps.depdebs.outputs.hash }}
        run: |
          set -euo pipefail
          {
            echo "lines<<HASHENV_EOF"
            [ "${SIGNS}" = yes ] && echo "MODULE_SIGNING_ACTIVE=${SIGNING_ACTIVE}"
            [ -z "${DEPS_HASH}" ] || echo "DEPS_HASH=${DEPS_HASH}"
            echo "HASHENV_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build ${{ inputs.package }}
        id: build
        uses: DaemonCores/DaemonCores-CI/build-deb@main
        with:
          package: ${{ inputs.package }}
          upstream: ${{ steps.def.outputs.upstream }}
          sources: ${{ steps.def.outputs.sources }}
          deb-glob: ${{ steps.def.outputs.deb_glob }}
          env: ${{ steps.track.outputs.env }}
          build: ${{ steps.def.outputs.build }}
          arch: ${{ inputs.arch }}
          extra-env: ${{ steps.hashenv.outputs.lines }}

      - name: ccache statistics
        if: always() && steps.def.outputs.ccache == 'yes'
        shell: bash
        run: ccache -s

      # The build failed but the last-good published deb was kept, so the
      # pipeline is not blocked. Record the breakage as an issue (deduped by
      # title). gh is absent in the build container, so use the REST API.
      - name: Flag broken build
        if: steps.build.outputs.build_failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          title="⚠️ Broken build: ${PKG} (last valid .deb reused)"
          body=$(printf '%s' \
            "The \`${PKG}\` build failed (compilation or post-patch content check). " \
            "The last published .deb was reused to avoid breaking production. " \
            "The cache hash is left unchanged so the fix will be retried on the next run. " \
            "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json")
          num=$(curl -fsSL "${auth[@]}" "${api}/issues?state=open&per_page=100" \
            | jq -r --arg t "${title}" \
              'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "${num}" ]; then
            curl -fsSL "${auth[@]}" -X POST "${api}/issues/${num}/comments" \
              -d "$(jq -n --arg b "${body}" '{body: $b}')" >/dev/null
          else
            curl -fsSL "${auth[@]}" -X POST "${api}/issues" \
              -d "$(jq -n --arg t "${title}" --arg b "${body}" \
                '{title: $t, body: $b}')" >/dev/null
          fi
          echo "::warning::${PKG} build broken — issue opened/updated, last valid .deb reused"

      # When the build succeeds, close any open issue for this package so the
      # tracker stays clean.
      - name: Close broken-build issue on success
        if: steps.build.outputs.build_failed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          title="⚠️ Broken build: ${PKG} (last valid .deb reused)"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json")
          num=$(curl -fsSL "${auth[@]}" "${api}/issues?state=open&per_page=100" \
            | jq -r --arg t "${title}" \
              'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "${num}" ]; then
            comment="Build of \`${PKG}\` succeeded in run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Closing."
            curl -fsSL "${auth[@]}" -X POST "${api}/issues/${num}/comments" \
              -d "$(jq -n --arg b "${comment}" '{body: $b}')" >/dev/null
            curl -fsSL "${auth[@]}" -X PATCH "${api}/issues/${num}" \
              -d '{"state":"closed"}' >/dev/null
            echo "Closed issue #${num} for ${PKG} (build recovered)"
          fi

      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="debs-${{ inputs.package }}-${{ inputs.arch }}"
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${artifact_name}" --jq '.artifacts[].id')
          for id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload ${{ inputs.package }} debs
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ inputs.package }}-${{ inputs.arch }}
          path: /debs
          include-hidden-files: true

      # The build failed and the last-good deb was reused (and uploaded above)
      # so the later waves and the publication still have an input. The job
      # itself must still end red: a green check on a broken build hides it.
      - name: Fail the job on a broken build
        if: steps.build.outputs.build_failed == 'true'
        shell: bash
        env:
          PKG: ${{ inputs.package }}
        run: |
          echo "::error::${PKG} build failed; the last valid .deb was reused, see the build step log"
          exit 1
