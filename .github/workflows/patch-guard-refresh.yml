name: Refresh kernel patch references

# Reusable job that keeps the sha256 references of the kernel files touched by
# the patches (kernel/patches.lock.json) in step with the latest stable kernel.
# It downloads the kernel.org tarball, applies every patch of the manifest for
# each class and architecture with PATCH_GUARD_UPDATE=1, and opens a pull
# request when the lock changed.  A patch that no longer applies fails the job
# and no pull request is opened.
#
# Triggers (schedule, workflow_dispatch) belong in the caller.

on:
  workflow_call:
    inputs:
      kernel-dir:
        description: 'Directory of the kernel manifest and lock in the caller repo'
        type: string
        default: workflows/bootc-debs-builder/kernel
      manifest:
        description: 'Package manifest that tracks the kernel (track: kernel-org)'
        type: string
        default: workflows/bootc-debs-builder/packages.yml
      package:
        description: 'Package of that manifest whose tracked kernel version is used'
        type: string
        default: linux-image

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tooling
        uses: actions/checkout@v4
        with:
          repository: DaemonCores/DaemonCores-CI
          ref: main
          path: .ci-tooling
          persist-credentials: false
      - name: Recompute the references on the latest stable kernel
        env:
          KDIR: ${{ inputs.kernel-dir }}
          MAN: ${{ inputs.manifest }}
          PKG: ${{ inputs.package }}
        run: |
          set -euo pipefail
          export CI_SCRIPTS="${PWD}/.ci-tooling/scripts"
          # kernel_fetch_source changes directory: every path must be absolute.
          KDIR="${PWD}/${KDIR}"
          MAN="${PWD}/${MAN}"
          export PATCH_GUARD_UPDATE=1
          # Same resolution as the kernel build (upstream-track): the newest
          # release whose series every patch source already provides, never the
          # bare latest stable (a patch source may lag behind it).
          export MAN PKG STRICT=true GITHUB_OUTPUT="${RUNNER_TEMP}/track.out"
          : >"${GITHUB_OUTPUT}"
          bash .ci-tooling/upstream-track/track.sh resolve
          version=$(sed -n 's/^KERNEL_VER=//p' "${GITHUB_OUTPUT}" | head -n1)
          [[ -n "${version}" ]] || { echo "kernel version not resolved" >&2; exit 1; }
          . "${CI_SCRIPTS}/kernel_helpers.sh"
          # Start from an empty lock: the guard only runs (and with
          # PATCH_GUARD_UPDATE=1 rewrites the lock) when a lock file exists.
          echo '{}' >"${KDIR}/patches.lock.json"
          for arch in amd64 arm64; do
            for class in kernel module; do
              kernel_fetch_source "${version}"
              kernel_apply_patches "${KDIR}/patches.yml" "${arch}" \
                "${version}" "${SRCDIR}" "${class}"
              rm -rf "${SRCDIR}"
            done
          done
          [ "$(jq length "${KDIR}/patches.lock.json")" -gt 0 ] \
            || { echo "patch lock came out empty" >&2; exit 1; }
      - name: Propose the new references
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/kernel-patch-references
          commit-message: 'chore(kernel): refresh the patch file references'
          title: 'chore(kernel): refresh the patch file references'
          body: >-
            A file touched by the kernel patches changed in the latest stable
            kernel, which refuses the kernel build until the references are
            updated. Every patch of the manifest still applies to it.
          add-paths: ${{ inputs.kernel-dir }}/patches.lock.json
