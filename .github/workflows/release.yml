name: Release

# Reusable release workflow driven by Conventional Commits.
#
# channel=edge    publishes a GitHub pre-release `<prefix><next>-edge.<n>` for
#                 the evaluated commit (`ref`).  The caller decides when: an
#                 edge tag must only mark a commit whose full pipeline is green.
# channel=stable  publishes `<prefix><next>` with generated notes.  It runs for
#                 a manual trigger (workflow_dispatch) or for a green pipeline
#                 run of the stable branch (workflow_run); never for a timer or
#                 a push, so a stable release always follows a green CI.
#
# Nothing is published when the commits since the last stable tag contain no
# fix, perf, revert, feat or breaking change.  Triggers belong in the caller.

on:
  workflow_call:
    inputs:
      channel:
        description: 'edge or stable'
        type: string
        default: edge
      prefix:
        description: 'Tag prefix'
        type: string
        default: v
      ref:
        description: >-
          Commit to release (the head of the pipeline run being released).
          Empty means the commit that triggered the caller.
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - name: Fetch tooling
        uses: actions/checkout@v4
        with:
          repository: DaemonCores/DaemonCores-CI
          ref: main
          path: .ci-tooling
          persist-credentials: false
      - name: Compute the version
        id: ver
        env:
          PREFIX: ${{ inputs.prefix }}
          REF: ${{ inputs.ref || github.sha }}
        run: bash .ci-tooling/next-version/next-version.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PREFIX: ${{ inputs.prefix }}
          BUMP: ${{ steps.ver.outputs.bump }}
          NEXT: ${{ steps.ver.outputs.next }}
          EDGE: ${{ steps.ver.outputs.edge }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.ref || github.sha }}
        run: |
          if [ "$BUMP" = none ]; then
            echo "::notice::No releasable change since the last stable tag."
            exit 0
          fi
          case "$CHANNEL" in
            edge)
              tag="${PREFIX}${EDGE}"
              flags=(--prerelease --notes "Automatic edge build of ${TARGET}.")
              ;;
            stable)
              case "$EVENT" in
                workflow_dispatch|workflow_run) ;;
                *)
                  echo "::error::A stable release needs a manual trigger or a green pipeline run."
                  exit 1
                  ;;
              esac
              tag="${PREFIX}${NEXT}"
              flags=(--generate-notes --latest)
              ;;
            *)
              echo "::error::Unknown channel '${CHANNEL}'."
              exit 1
              ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::${tag} already exists."
            exit 0
          fi
          gh release create "$tag" --target "$TARGET" --title "$tag" "${flags[@]}"
