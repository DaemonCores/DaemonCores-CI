name: Release

# Reusable release workflow driven by Conventional Commits.
#
# channel=edge    publishes a GitHub pre-release `<prefix><next>-edge.<n>` for
#                 the evaluated commit; safe to call on every push to main.
# channel=stable  publishes `<prefix><next>` with generated notes.  It only runs
#                 for a manual trigger (workflow_dispatch) so a stable release
#                 is always a human decision, never a timer.
#
# Nothing is published when the commits since the last stable tag contain no
# fix, perf, revert, feat or breaking change.  Triggers belong in the caller.

on:
  workflow_call:
    inputs:
      channel:
        description: 'edge or stable'
        type: string
        default: edge
      prefix:
        description: 'Tag prefix'
        type: string
        default: v

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tooling
        uses: actions/checkout@v4
        with:
          repository: DaemonCores/DaemonCores-CI
          ref: main
          path: .ci-tooling
          persist-credentials: false
      - name: Compute the version
        id: ver
        env:
          PREFIX: ${{ inputs.prefix }}
          REF: ${{ github.sha }}
        run: bash .ci-tooling/next-version/next-version.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PREFIX: ${{ inputs.prefix }}
          BUMP: ${{ steps.ver.outputs.bump }}
          NEXT: ${{ steps.ver.outputs.next }}
          EDGE: ${{ steps.ver.outputs.edge }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$BUMP" = none ]; then
            echo "::notice::No releasable change since the last stable tag."
            exit 0
          fi
          case "$CHANNEL" in
            edge)
              tag="${PREFIX}${EDGE}"
              flags=(--prerelease --notes "Automatic edge build of ${GITHUB_SHA}.")
              ;;
            stable)
              if [ "$EVENT" != workflow_dispatch ]; then
                echo "::error::A stable release must be triggered manually."
                exit 1
              fi
              tag="${PREFIX}${NEXT}"
              flags=(--generate-notes --latest)
              ;;
            *)
              echo "::error::Unknown channel '${CHANNEL}'."
              exit 1
              ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::${tag} already exists."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" "${flags[@]}"
