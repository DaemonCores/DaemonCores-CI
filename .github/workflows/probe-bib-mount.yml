name: probe-mount
on:
  workflow_dispatch:

# Probe for the amd64-only osbuild mount EPERM (P-757). The scenario matrix
# lives in .ci-tooling/scripts/probe_bib_mount.sh (avoids shell quoting in
# the workflow itself).
permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman

      - name: Run the mount probes
        run: |
          sudo -n .ci-tooling/scripts/probe_bib_mount.sh "" "${{ matrix.arch }}" 2>/dev/null \
            || .ci-tooling/scripts/probe_bib_mount.sh "" "${{ matrix.arch }}"