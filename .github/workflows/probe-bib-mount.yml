name: probe-mount
on:
  workflow_dispatch:

# Probe 2 for the amd64-only osbuild mount EPERM (P-757). Probe run 1
# (41559582446, kernel 7.0.0-1017-azure): plain rbind RW = OK, rbind RW from
# unshare -Urm = OK. So the userns knob is NOT the cause. This run tests the
# REAL osbuild scenario: the store is first bound READ-ONLY (the osbuild
# sandbox binds its inputs ro), then containers_storage_source rbinds/mounts
# it READ_WRITE from inside that read-only mount.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman

      - name: Probe ro-then-rw rbind in bib_amd64
        run: |
          set -uo pipefail
          echo "== kernel =="
          uname -r
          mkdir -p run-store/overlay
          sudo podman pull ghcr.io/daemoncores/debian-bootc:bib_amd64 >/dev/null 2>&1 || true
          BIB=ghcr.io/daemoncores/debian-bootc:bib_amd64

          echo "== PROBE D: sandbox binds the store RO, then rbind RW of that RO tree =="
          sudo podman run --rm --privileged --security-opt apparmor=unconfined \
            --entrypoint /bin/sh \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            "${BIB}" -c \
            'mkdir -p /tmp/orig && mount --rbind -o ro,0755 --make-rprivate /var/lib/containers/storage /tmp/orig &&
             unshare -Urm sh -c "mkdir -p /tmp/osp &&
               mount --rbind -o ro,0755 --make-rprivate /tmp/orig /tmp/osp && echo D_RO_BIND_OK || echo D_RO_BIND_FAIL;
               mount -o remount,bind,rw /tmp/osp && echo D_REMOUNT_RW_OK || echo D_REMOUNT_RW_FAIL;
               rm -rf /tmp/osp2; mkdir -p /tmp/osp2;
               mount --rbind -o rw,0755 --make-rprivate /tmp/orig /tmp/osp2 && echo D_FRESHRW_BIND_OK || echo D_FRESHRW_BIND_FAIL"'

          echo "== PROBE E: same, no unshare (mount ns only) =="
          sudo podman run --rm --privileged --security-opt apparmor=unconfined \
            --entrypoint /bin/sh \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            "${BIB}" -c \
            'mkdir -p /tmp/orig && mount --rbind -o ro,0755 --make-rprivate /var/lib/containers/storage /tmp/orig &&
             unshare -m sh -c "mkdir -p /tmp/osp &&
               mount --rbind -o ro,0755 --make-rprivate /tmp/orig /tmp/osp && echo E_RO_BIND_OK || echo E_RO_BIND_FAIL;
               mount -o remount,bind,rw /tmp/osp && echo E_REMOUNT_RW_OK || echo E_REMOUNT_RW_FAIL"'

          echo "== kernel ring buffer =="
          sudo dmesg | tail -40 || true