name: iso

# Builds a live-boot installation ISO from the installer container image
# (ghcr.io/<owner>/<repo>:iso_amd64_autoupdate, built by the `image` job).
#
# The installer container is a bootc image that boots directly into a graphical
# installer (bootc-installer GTK4 + fisherman Go backend). bootc-image-builder
# converts this container into a dracut live-boot ISO.
#
# The ISO is uploaded to the `install-iso` GitHub Release as both an online
# variant (pulls the system image at install time) and an offline variant
# (embeds the system image for airgapped installs). The online/offline
# distinction is set in the recipe.json embedded in the installer image.
#
# Replaces the previous Fedora/Anaconda-based ISO builder.

on:
  workflow_call:
    inputs:
      product_name:
        type: string
        default: ""

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # --privileged is required for loop mounts inside bootc-image-builder.
    # Do NOT remove it.
    permissions:
      contents: write
      packages: read

    steps:

      - uses: actions/checkout@v7

      # ─── INSTALL TOOLS ────────────────────────────────────────────────────

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman fuse-overlayfs isomd5sum xorriso curl jq

      # ─── VARIABLES ────────────────────────────────────────────────────────

      - name: Compute names
        id: names
        run: |
          set -euo pipefail
          NAME="$(echo "${{ github.repository }}" | sed 's|/|-|g')"
          HOSTNAME="$(echo "${{ github.repository }}" | cut -d "/" -f 2)"
          DISPLAY_NAME="${{ inputs.product_name }}"
          if [ -z "${DISPLAY_NAME}" ]; then
            DISPLAY_NAME=$(python3 -c "
          h = '${HOSTNAME}'.replace('-',' ').replace('_',' ')
          print(' '.join(w.capitalize() for w in h.split()))
          ")
          fi
          {
            echo "name=${NAME}"
            echo "hostname=${HOSTNAME}"
            echo "display_name=${DISPLAY_NAME}"
          } >> "$GITHUB_OUTPUT"

      # ─── RELEASE ──────────────────────────────────────────────────────────

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.names.outputs.name }}"
          DISPLAY="${{ steps.names.outputs.display_name }}"
          title="Install ISO — $(date -u +%Y-%m-%d)"
          notes="Live graphical installer ISO for ${DISPLAY}. Boots directly into the bootc-installer GTK4 wizard."
          if gh release view install-iso \
               --repo "${{ github.repository }}" \
               --json name >/dev/null 2>&1; then
            gh release edit install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          else
            gh release create install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          fi

      # ─── PULL INSTALLER IMAGE ────────────────────────────────────────────

      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG }}
        run: |
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      - name: Pull installer container image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:iso_amd64_autoupdate"
          echo "Pulling installer image: ${IMAGE}"
          sudo podman pull "${IMAGE}"
          echo "INSTALLER_IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      # ─── BUILD LIVE ISO ───────────────────────────────────────────────────

      - name: Build live ISO with bootc-image-builder
        run: |
          set -euo pipefail
          mkdir -p out

          # bootc-image-builder --type iso produces a dracut live-boot ISO.
          # The container's filesystem is squashfs'd; the kernel + initrd from
          # the container boot directly — no Anaconda, no kickstart needed.
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/out:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch amd64 \
            "${INSTALLER_IMAGE}"

          # bootc-image-builder writes the ISO to /output/bootiso/
          ISO=$(find out -name "*.iso" | head -1)
          if [ -z "${ISO}" ]; then
            echo "ERROR: bootc-image-builder did not produce an .iso file" >&2
            ls -lR out/ >&2
            exit 1
          fi
          echo "Built ISO: ${ISO}"
          echo "ISO_PATH=${ISO}" >> "$GITHUB_ENV"
          # Re-implant ISO MD5 for media verification
          implantisomd5 "${ISO}" || true

      # ─── RENAME AND CHECKSUM ─────────────────────────────────────────────

      - name: Rename ISO and compute checksum
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          DEST="out/${NAME}-installer.iso"
          mv "${ISO_PATH}" "${DEST}"
          sha256sum "${DEST}" > "${DEST}.sha256"
          echo "ISO_FINAL=${DEST}" >> "$GITHUB_ENV"
          echo "Built: $(du -sh ${DEST})"

      # ─── UPLOAD ───────────────────────────────────────────────────────────

      - name: Upload ISO to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload install-iso \
            --repo "${{ github.repository }}" \
            "${ISO_FINAL}" \
            "${ISO_FINAL}.sha256" \
            --clobber
