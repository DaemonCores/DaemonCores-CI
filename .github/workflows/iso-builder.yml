name: iso

# Builds live-boot installation ISOs from the installer container image
# (ghcr.io/<owner>/<repo>:iso-<arch>-autoupdate, built by the `image` job).
#
# The installer container is a thin layer on top of the base image. It adds
# only the graphical installer stack (bootc-installer GTK4 + fisherman Go
# backend + cage + Mesa). bootc-image-builder converts it to a dracut live ISO.
#
# Two modes, determined by the compressed size of the payload image:
#   - offline (< 1.8 GiB): ISO embeds the clean base image as the install
#     payload via --bootc-installer-payload-ref; no network needed at install.
#   - net-install (>= 1.8 GiB): ISO is too large for GitHub Releases; falls
#     back to the minimal image as the live env; all installs require network.
#
# Both amd64 and arm64 ISOs are built in parallel.

on:
  workflow_call:
    inputs:
      product_name:
        type: string
        default: ""

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # --privileged is required for loop mounts inside bootc-image-builder.
    # Do NOT remove it.
    permissions:
      contents: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:

      - uses: actions/checkout@v7

      # ─── INSTALL TOOLS ────────────────────────────────────────────────────

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman fuse-overlayfs isomd5sum xorriso curl jq

      # ─── VARIABLES ────────────────────────────────────────────────────────

      - name: Compute names
        id: names
        run: |
          set -euo pipefail
          NAME="$(echo "${{ github.repository }}" | sed 's|/|-|g')"
          HOSTNAME="$(echo "${{ github.repository }}" | cut -d "/" -f 2)"
          DISPLAY_NAME="${{ inputs.product_name }}"
          if [ -z "${DISPLAY_NAME}" ]; then
            DISPLAY_NAME=$(python3 -c "
          h = '${HOSTNAME}'.replace('-',' ').replace('_',' ')
          print(' '.join(w.capitalize() for w in h.split()))
          ")
          fi
          {
            echo "name=${NAME}"
            echo "hostname=${HOSTNAME}"
            echo "display_name=${DISPLAY_NAME}"
          } >> "$GITHUB_OUTPUT"

      # ─── RELEASE ──────────────────────────────────────────────────────────

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.names.outputs.name }}"
          DISPLAY="${{ steps.names.outputs.display_name }}"
          title="Install ISO — $(date -u +%Y-%m-%d)"
          notes="Live graphical installer ISO for ${DISPLAY}. Boots directly into the bootc-installer GTK4 wizard."
          if gh release view install-iso \
               --repo "${{ github.repository }}" \
               --json name >/dev/null 2>&1; then
            gh release edit install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          else
            gh release create install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          fi

      # ─── PULL IMAGES ──────────────────────────────────────────────────────

      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG }}
        run: |
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      - name: Detect payload size and choose build mode
        id: mode
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          REPO="${GITHUB_REPOSITORY,,}"

          # The payload is the clean base image — what gets installed on disk.
          PAYLOAD="ghcr.io/${REPO}:latest-${ARCH}-autoupdate"
          # The installer image is the thin live env (base + installer layer).
          INSTALLER="ghcr.io/${REPO}:iso-${ARCH}-autoupdate"

          sudo podman pull "${PAYLOAD}"
          sudo podman pull "${INSTALLER}"

          # Sum compressed layer sizes from the manifest to estimate download/ISO size.
          PAYLOAD_SIZE=$(sudo podman manifest inspect "${PAYLOAD}" \
            | jq '[.layers[].size] | add // 0')
          THRESHOLD=$((1800 * 1024 * 1024))  # 1.8 GiB

          if [ "${PAYLOAD_SIZE}" -lt "${THRESHOLD}" ]; then
            echo "Payload ${PAYLOAD_SIZE} bytes < ${THRESHOLD} — offline ISO mode"
            echo "offline=true"  >> "$GITHUB_OUTPUT"
            echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          else
            echo "Payload ${PAYLOAD_SIZE} bytes >= ${THRESHOLD} — net-install ISO mode"
            # Use minimal image as live env to keep ISO small
            MINIMAL="ghcr.io/${REPO}:iso-minimal-${ARCH}-autoupdate"
            sudo podman pull "${MINIMAL}"
            echo "offline=false" >> "$GITHUB_OUTPUT"
            echo "installer=${MINIMAL}" >> "$GITHUB_OUTPUT"
          fi
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"

      # ─── BUILD LIVE ISO ───────────────────────────────────────────────────

      - name: Build live ISO with bootc-image-builder
        run: |
          set -euo pipefail
          mkdir -p out

          ARCH="${{ matrix.arch }}"
          INSTALLER="${{ steps.mode.outputs.installer }}"
          PAYLOAD="${{ steps.mode.outputs.payload }}"
          OFFLINE="${{ steps.mode.outputs.offline }}"

          # Offline: embed the clean base as the install payload (no network needed).
          # Net-install: no --bootc-installer-payload-ref; image is pulled at install time.
          PAYLOAD_ARGS=()
          if [ "${OFFLINE}" = "true" ]; then
            PAYLOAD_ARGS=(--bootc-installer-payload-ref "${PAYLOAD}")
          fi

          # bootc-image-builder --type iso produces a dracut live-boot ISO.
          # The container's filesystem is squashfs'd; the kernel + initrd from
          # the container boot directly — no Anaconda, no kickstart needed.
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$(pwd)/out:/output" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --target-arch "${ARCH}" \
            "${PAYLOAD_ARGS[@]}" \
            "${INSTALLER}"

          # bootc-image-builder writes the ISO to /output/bootiso/
          ISO=$(find out -name "*.iso" | head -1)
          if [ -z "${ISO}" ]; then
            echo "ERROR: bootc-image-builder did not produce an .iso file" >&2
            ls -lR out/ >&2
            exit 1
          fi
          echo "Built ISO: ${ISO}"
          echo "ISO_PATH=${ISO}" >> "$GITHUB_ENV"
          # Re-implant ISO MD5 for media verification
          implantisomd5 "${ISO}" || true

      # ─── RENAME AND CHECKSUM ─────────────────────────────────────────────

      - name: Rename ISO and compute checksum
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          OFFLINE="${{ steps.mode.outputs.offline }}"
          NAME="${{ steps.names.outputs.name }}"

          if [ "${OFFLINE}" = "true" ]; then
            DEST="out/${NAME}-${ARCH}-installer.iso"
          else
            DEST="out/${NAME}-${ARCH}-netinstall.iso"
          fi

          mv "${ISO_PATH}" "${DEST}"
          sha256sum "${DEST}" > "${DEST}.sha256"
          echo "ISO_FINAL=${DEST}" >> "$GITHUB_ENV"
          echo "Built: $(du -sh ${DEST})"

      # ─── UPLOAD ───────────────────────────────────────────────────────────

      - name: Upload ISO to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload install-iso \
            --repo "${{ github.repository }}" \
            "${ISO_FINAL}" \
            "${ISO_FINAL}.sha256" \
            --clobber
