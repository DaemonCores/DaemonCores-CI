name: iso

# Builds live-boot installation ISOs from the installer container image
# (ghcr.io/<owner>/<repo>:iso_<arch>, built by the `image` job).
#
# The installer container is a thin layer on top of the base image. It adds
# only the graphical installer stack (bootc-installer GTK4 + fisherman Go
# backend + cage + Mesa). bootc-image-builder converts it to a dracut live ISO.
#
# Two modes, determined by the compressed size of the payload image:
#   - offline (< 1.8 GiB): ISO embeds the clean base image as the install
#     payload via --installer-payload-ref; no network needed at install.
#   - net-install (>= 1.8 GiB): ISO is too large for GitHub Releases; the ISO
#     carries only the live env and all installs require network.
#
# Both amd64 and arm64 ISOs are built in parallel.

on:
  workflow_call:
    inputs:
      product_name:
        type: string
        default: ""

jobs:
  build-iso:
    # Native runner per architecture, as the image builds: no emulation.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # --privileged is required for loop mounts inside bootc-image-builder.
    # Do NOT remove it.
    permissions:
      contents: write
      packages: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:

      - uses: actions/checkout@v7

      # ─── INSTALL TOOLS ────────────────────────────────────────────────────

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            podman fuse-overlayfs isomd5sum xorriso curl jq

      # ─── VARIABLES ────────────────────────────────────────────────────────

      - name: Compute names
        id: names
        run: |
          set -euo pipefail
          NAME="$(echo "${{ github.repository }}" | sed 's|/|-|g')"
          HOSTNAME="$(echo "${{ github.repository }}" | cut -d "/" -f 2)"
          DISPLAY_NAME="${{ inputs.product_name }}"
          if [ -z "${DISPLAY_NAME}" ]; then
            DISPLAY_NAME=$(python3 -c "
          h = '${HOSTNAME}'.replace('-',' ').replace('_',' ')
          print(' '.join(w.capitalize() for w in h.split()))
          ")
          fi
          {
            echo "name=${NAME}"
            echo "hostname=${HOSTNAME}"
            echo "display_name=${DISPLAY_NAME}"
          } >> "$GITHUB_OUTPUT"

      # ─── RELEASE ──────────────────────────────────────────────────────────

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.names.outputs.name }}"
          DISPLAY="${{ steps.names.outputs.display_name }}"
          title="Install ISO — $(date -u +%Y-%m-%d)"
          notes="Live graphical installer ISO for ${DISPLAY}. Boots directly into the bootc-installer GTK4 wizard."
          if gh release view install-iso \
               --repo "${{ github.repository }}" \
               --json name >/dev/null 2>&1; then
            gh release edit install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          else
            gh release create install-iso \
              --repo    "${{ github.repository }}" \
              --title   "$title" \
              --notes   "$notes" \
              --target  "${{ github.sha }}" \
              --latest=false
          fi

      # ─── PULL IMAGES ──────────────────────────────────────────────────────

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${GHCR_TOKEN}"

      - name: Detect payload size and choose build mode
        id: mode
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          REPO="${GITHUB_REPOSITORY,,}"

          # The payload is the clean base image — what gets installed on disk.
          PAYLOAD="ghcr.io/${REPO}:latest_${ARCH}"
          # The installer image is the thin live env (base + installer layer).
          INSTALLER="ghcr.io/${REPO}:iso_${ARCH}"

          sudo podman pull "${PAYLOAD}"
          sudo podman pull "${INSTALLER}"

          # Sum compressed layer sizes from the registry manifest to estimate
          # download/ISO size (`podman manifest inspect` only expands manifest
          # lists: on a single-image tag it prints `manifests: null`).
          PAYLOAD_SIZE=$(sudo skopeo inspect --raw "docker://${PAYLOAD}" \
            | jq '[.layers[].size] | add // 0')
          THRESHOLD=$((1800 * 1024 * 1024))  # 1.8 GiB
          # Net-install exists only in the legacy rpm path: the container
          # based bootc-installer REQUIRES --installer-payload-ref ("no
          # installer payload bootc ref set", run 41569629969) so with the
          # Debian/bib path the ISO is always offline. Oversized ISOs (> the
          # 2 GiB GitHub release asset cap: 422, amd64 2.2G, run
          # 41567748715) are handled by the upload step as split parts.

          if [ "${PAYLOAD_SIZE}" -lt "${THRESHOLD}" ]; then
            echo "Payload ${PAYLOAD_SIZE} bytes < ${THRESHOLD} — offline ISO mode"
            echo "offline=true"  >> "$GITHUB_OUTPUT"
            echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          else
            echo "Payload ${PAYLOAD_SIZE} bytes >= ${THRESHOLD} — net-install ISO mode"
            echo "offline=false" >> "$GITHUB_OUTPUT"
            echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          fi
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"

      # ─── BUILD LIVE ISO ───────────────────────────────────────────────────

      - name: Build live ISO with bootc-image-builder
        run: |
          set -euo pipefail
          mkdir -p out

          ARCH="${{ matrix.arch }}"
          INSTALLER="${{ steps.mode.outputs.installer }}"
          PAYLOAD="${{ steps.mode.outputs.payload }}"
          OFFLINE="${{ steps.mode.outputs.offline }}"

          # Offline: embed the clean base as the install payload (no network needed).
          # Net-install: no --installer-payload-ref; image is pulled at install time.
          PAYLOAD_ARGS=()
          if [ "${OFFLINE}" = "true" ]; then
            PAYLOAD_ARGS=(--installer-payload-ref "${PAYLOAD}")
          fi

          # The product may ship its own Debian-capable bootc-image-builder
          # (Containerfile.bib, tag bib_<arch>); prefer it, fall back to the
          # upstream image otherwise.
          BIB="ghcr.io/${GITHUB_REPOSITORY,,}:bib_${ARCH}"
          BIB_IMAGE="quay.io/centos-bootc/bootc-image-builder:latest"
          if sudo podman pull "${BIB}" >/dev/null 2>&1; then
            BIB_IMAGE="${BIB}"
          else
            echo "::warning::no bib_${ARCH} image — falling back to the upstream builder"
          fi
          echo "Builder image: ${BIB_IMAGE}"

          # bootc-image-builder --type iso produces a dracut live-boot ISO.
          # The container's filesystem is squashfs'd; the kernel + initrd from
          # the container boot directly — no Anaconda, no kickstart needed.
          # The runner's `podman login` (rootful) may store GHCR creds at
          # /run/containers/auth.json or /root/.config/containers/auth.json;
          # a missing mount source kills the run (statfs, 125). The file is
          # copied to the workspace and mounted INSIDE the builder at the
          # inner podman's default authfile path — --authfile on `podman run`
          # would only authenticate podman's own (already done) image pull.
          AUTHFILE_SRC=""
          if [ -f /run/containers/auth.json ]; then
            AUTHFILE_SRC=/run/containers/auth.json
          elif [ -f /root/.config/containers/auth.json ]; then
            AUTHFILE_SRC=/root/.config/containers/auth.json
          fi
          AUTH_ARGS=()
          if [ -n "${AUTHFILE_SRC}" ]; then
            sudo cp "${AUTHFILE_SRC}" auth.json
            sudo chown "$(id -u)" auth.json
            AUTH_ARGS+=(-v "$(pwd)/auth.json:/run/containers/auth.json:ro")
          fi
          # The manifest stage reads the payload refs from the host container
          # storage (bib_main overlay); the osbuild container-deploy stage
          # mounts the payload image. Ubuntu 24.04 runner kernels deny those
          # mounts even under --privileged (apparmor), hence unconfined.
          # DEBUG(P-757 amd64 mount denial): environment proof of the store
          # filesystems and podman driver, per arch.
          echo "== findmnt /var/lib/containers/storage =="
          findmnt -no FSTYPE,SOURCE,OPTIONS -T /var/lib/containers/storage || true
          echo "== podman info (driver, graph root) =="
          sudo podman info --format '{{.Store.GraphDriverName}} {{.Store.GraphRoot}}' || true
          # amd64-only osbuild EPERM (runs 41543534089..41557034878; arm64
          # mounts fine): the ubuntu-24.04 amd64 runner image loads an
          # AppArmor "bwrap" profile (bwrap-userns-restrict / unpriv_bwrap)
          # that denies CAP_SYS_ADMIN to the children of bubblewrap, so the
          # osbuild buildroot sandbox cannot mount. Probes 41565044610:
          # BEFORE_FAIL -> apparmor_parser -R -> AFTER_OK on the same kernel.
          sudo apparmor_parser -R /etc/apparmor.d/unpriv_bwrap 2>/dev/null || true
          for p in /etc/apparmor.d/*bwrap*; do
            [ -e "$p" ] && sudo apparmor_parser -R "$p" || true
          done
          echo "== mounts under the store =="
          cat /proc/self/mountinfo | grep containers/storage | head -5 || true
          # The manifest stage reads/pulls the payload refs from container
          # storage; the osbuild container-deploy stage rbinds the store into
          # the osbuild sandbox. Sharing the HOST store with the builder made
          # that rbind fail with EPERM on the amd64 runner (overlay mounts of
          # another podman instance under /var/lib/containers/storage); a fresh store owned by
          # the inner podman alone mounts fine (proven by the arm64 job).
          mkdir -p run-store/overlay
          # containers-storage: refs do not pull — the builder's fresh store
          # only contains what is pulled INTO it, and the libpod DB records
          # the paths it was written under. Pulling from the job recorded
          # run-store/libpod while the builder expects
          # /var/lib/containers/storage/libpod ("database configuration
          # mismatch", run 41545038779): pull with the builder's own podman,
          # inside a container bound to the same store layout it will use.
          # rshared propagation on the store bind: the osbuild sandbox rbinds
          # the store itself and private propagation denies that nested rbind
          # on the amd64 runner (mount permission denied: runs 41533824293,
          # 41540601625, 41546441824).
          sudo podman run \
            --rm \
            --privileged \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            ${AUTH_ARGS[@]+${AUTH_ARGS[@]}} \
            --entrypoint /usr/bin/podman \
            "${BIB_IMAGE}" \
            pull "${PAYLOAD}" "${INSTALLER}"
          sudo podman run \
            --rm \
            --privileged \
            --security-opt apparmor=unconfined \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            ${AUTH_ARGS[@]+${AUTH_ARGS[@]}} \
            -v "$(pwd)/out:/output" \
            "${BIB_IMAGE}" \
            --type iso \
            --target-arch "${ARCH}" \
            "${PAYLOAD_ARGS[@]}" \
            "${INSTALLER}"

          # bootc-image-builder writes the ISO to /output/bootiso/ — as root:
          # give it back to the runner user, or the rename step and
          # implantisomd5 (which opens the file r+w) hit permission denied.
          sudo chown -R "$(id -u):$(id -g)" out
          ISO=$(find out -name "*.iso" | head -1)
          if [ -z "${ISO}" ]; then
            echo "ERROR: bootc-image-builder did not produce an .iso file" >&2
            ls -lR out/ >&2
            exit 1
          fi
          echo "Built ISO: ${ISO}"
          echo "ISO_PATH=${ISO}" >> "$GITHUB_ENV"
          # Re-implant ISO MD5 for media verification
          implantisomd5 "${ISO}" || true

      # Reproduce the osbuild mount on failure (amd64 EPERM, runs
      # 41543534089..41551945087): the exact rbind of the builder store from
      # a user/mount namespace, plus the kernel verdicts, so the next fix is
      # a proof, not a guess.
      - name: Diagnose the osbuild mount failure
        if: failure()
        run: |
          set -uo pipefail
          echo "== runner kernel =="
          uname -r
          echo "== apparmor state =="
          cat /sys/module/apparmor/parameters/enabled 2>/dev/null || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          echo "== bwrap present? =="
          command -v bwrap || true
          echo "== PROBE: rbind of the store in the bib image, plain =="
          BIB="${GITHUB_REPOSITORY,,}:bib_${{ matrix.arch }}"
          sudo podman run --rm --privileged --security-opt apparmor=unconfined \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            "${BIB}" sh -c \
            'mkdir -p /run/osp && mount --rbind /var/lib/containers/storage /run/osp -o ro,0755 && echo PLAIN_BIND_OK || echo PLAIN_BIND_FAIL'
          echo "== PROBE: same from a user+mount namespace (bwrap-like, as root) =="
          sudo podman run --rm --privileged --security-opt apparmor=unconfined \
            -v "$(pwd)/run-store:/var/lib/containers/storage:rshared" \
            "${BIB}" sh -c \
            'unshare -Urm sh -c "mkdir -p /run/osp && mount --rbind /var/lib/containers/storage /run/osp -o ro,0755 && echo UNSHARE_BIND_OK || echo UNSHARE_BIND_FAIL"'
          echo "== kernel ring buffer =="
          sudo dmesg | tail -60 || true
          echo "== audit log (AppArmor denials) =="
          sudo journalctl -k 2>/dev/null | grep -iE "apparmor|audit" | tail -30 || true

      # ─── RENAME AND CHECKSUM ──────────────────────────────────────────────

      - name: Rename ISO and compute checksum
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          OFFLINE="${{ steps.mode.outputs.offline }}"
          NAME="${{ steps.names.outputs.name }}"

          if [ "${OFFLINE}" = "true" ]; then
            DEST="out/${NAME}-${ARCH}-installer.iso"
          else
            DEST="out/${NAME}-${ARCH}-netinstall.iso"
          fi

          mv "${ISO_PATH}" "${DEST}"
          sha256sum "${DEST}" > "${DEST}.sha256"
          echo "ISO_FINAL=${DEST}" >> "$GITHUB_ENV"
          echo "Built: $(du -sh ${DEST})"

      # ─── BOOT SMOKE TEST ──────────────────────────────────────────────────
      # The ISO must actually boot. Regression this gate exists for
      # (owner, 2026-11-11): every kernel lane stayed green (disk images
      # never boot through squashfs) while every published live ISO died in
      # dracut emergency at initrd-switch-root (the live root /LiveOS/
      # squashfs.img needs the kernel SQUASHFS module). A failed test blocks
      # the upload: no dead ISO ever reaches the release again.
      - name: Boot smoke test the ISO (QEMU)
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          ISO="${ISO_FINAL}"
          LOG="out/boot-test-serial.log"

          if [ "${ARCH}" = "amd64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
            QEMU="qemu-system-x86_64 -machine q35 -cpu max"
            FW_ARGS=(-bios /usr/share/ovmf/OVMF.fd)
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64
            QEMU="qemu-system-aarch64 -machine virt -cpu max"
            FW_ARGS=(-pflash /usr/share/qemu-efi-aarch64/QEMU_EFI.fd)
          fi

          # Hosted runners expose /dev/kvm but deny access to the runner user
          # ("Could not access KVM kernel module: Permission denied", the
          # first ISO smoke run): always run TCG. 900 s budget.
          timeout 900 ${QEMU} \
            "${FW_ARGS[@]}" \
            -m 4096 -smp 2 -display none \
            -accel tcg \
            -cdrom "${ISO}" \
            -serial file:"${LOG}" 2>&1 | tail -5
          RC=$?
          set -e

          echo "== boot serial log (head) =="
          head -40 "${LOG}" 2>/dev/null || echo "EMPTY SERIAL LOG"
          if [ "${RC}" -ne 124 ]; then
            echo "QEMU exited with ${RC} before the timeout — firmware/boot failure" >&2
            exit 1
          fi
          if grep -qE "emergency mode|dracut-emergency|initrd-switch-root.service.*[Ff]ailed" "${LOG}"; then
            echo "::error::live ISO boot FAILED — dracut emergency (see head of ${LOG})"
            exit 1
          fi
          if ! grep -qE "Switching root|switch root|Reached target Basic System|Started" "${LOG}"; then
            echo "::error::live ISO boot did not reach the live OS within 600 s (no switch-root/systemd progress in serial log)" >&2
            exit 1
          fi
          echo "ISO boot smoke test PASSED"

      # ─── UPLOAD ───────────────────────────────────────────────────────────

      - name: Upload ISO to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A previously interrupted multipart upload can leave a pending
          # asset with the same name that gh release upload --clobber cannot
          # replace (HTTP 422 already_exists, run 41565502790 amd64): delete
          # the stale asset by name first.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/install-iso" --jq .id)
          ASSET_NAME=$(basename "${ISO_FINAL}")
          for ext in "" ".sha256"; do
            ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
              --jq ".[] | select(.name == \"${ASSET_NAME}${ext}\") | .id" || true)
            if [ -n "${ASSET_ID}" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${ASSET_ID}" >/dev/null
            fi
          done
          # GitHub release assets cap at 2 GiB (HTTP 422 above it: runs
          # 41565502790, 41567748715 on the 2.2G amd64 offline ISO).
          # Oversized ISOs are uploaded as split parts (ISO_PARTS, cat to
          # rejoin); the sha256 always names the FULL iso.
          SIZE=$(stat -c %s "${ISO_FINAL}")
          CAP=2147483648
          if [ "${SIZE}" -gt "${CAP}" ]; then
            echo "ISO ${SIZE} bytes > ${CAP}: split upload"
            rm -rf parts && mkdir parts
            split --numeric-suffixes=0 --suffix-length=2 --bytes=1900MiB \
              "${ISO_FINAL}" "parts/${ASSET_NAME}.part-"
            ISO_ASSETS=$(echo "parts/${ASSET_NAME}.part-*" "${ISO_FINAL}.sha256")
          else
            rm -rf parts && mkdir parts
            ISO_ASSETS=$(ls "${ISO_FINAL}" "${ISO_FINAL}.sha256")
          fi
          gh release upload install-iso \
            --repo "${{ github.repository }}" \
            ${ISO_ASSETS} \
            --clobber
