name: Build & Publish Bootc .deb

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install clone deps
        shell: bash
        run: |
          apt update
          apt install -y \
            ca-certificates \
            openssl \
            git \
            curl \
            wget

      - name: Checkout
        uses: actions/checkout@v7 
        with:
          submodules: recursive
      
      - name: Prepare environement
        shell: bash
        run: |
          cp -r ./workflows/bootc-debs-builder/preinstall/* /
          mkdir -p /{build,debs}

      - name: Install build deps
        shell: bash
        env:
          CARGO_HOME: "/build/rust"
          RUSTUP_HOME: "/build/rust"
          PVE_GPG_SHA256: 136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
        run: |
          apt update
          apt install -y \
            zstd \
            make \
            build-essential \
            go-md2man \
            libzstd-dev \
            pkgconf \
            autoconf \
            automake \
            libtool \
            libglib2.0-dev \
            libcurl4-openssl-dev \
            libgpgme-dev \
            libarchive-dev \
            libmount-dev \
            libfuse3-dev \
            libssl-dev \
            libsystemd-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            libsoup-3.0-dev \
            bison \
            gperf \
            flex \
            gettext \
            python3 \
            autopoint \
            gawk \
            meson \
            ninja-build \
            libfreetype6-dev \
            sbsigntool

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --profile minimal -y

      - name: Checkout CI tools
        uses: actions/checkout@v4
        with:
          repository: DaemonCores/DaemonCores-CI
          path: .ci-tools

      - name: Install yq
        shell: bash
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Build packages from packages.yml
        shell: bash
        env:
          CARGO_HOME: "/build/rust"
          RUSTUP_HOME: "/build/rust"
          SB_SIGNING_KEY: ${{ secrets.SB_SIGNING_KEY }}
          SB_SIGNING_CERT: ${{ secrets.SB_SIGNING_CERT }}
        run: |
          set -euxo pipefail
          # Each entry in packages.yml is a verbatim copy of the original
          # build step (name, env, run block). We read it with yq and execute
          # the run script for every package in order.
          PKG_COUNT=$(yq -r '.packages | length' packages.yml)
          for i in $(seq 0 $((PKG_COUNT - 1))); do
            NAME=$(yq -r ".packages[${i}].name" packages.yml)
            ENV_YAML=$(yq -o=json ".packages[${i}].env // {}" packages.yml)
            RUN_SCRIPT=$(yq -r ".packages[${i}].run" packages.yml)

            echo "::group::Building ${NAME}"
            # Export env vars from the package's env block
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              KEY=$(printf '%s' "$line" | cut -d'=' -f1)
              VAL=$(printf '%s' "$line" | cut -d'=' -f2-)
              export "${KEY}=${VAL}"
            done <<< "$(printf '%s' "$ENV_YAML" | yq -o=props 'to_entries | .[] | .key + "=" + (.value | tostring)')"

            bash -c "${RUN_SCRIPT}"
            echo "::endgroup::"
          done

      
      - name: Upload debs
        uses: actions/upload-artifact@v7
        with:
          name: debs
          path: /debs/*.deb

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:

      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: debs/

      - name: Create APT repo
        id: create-apt-repo
        uses: morph027/apt-repo-action@v3
        with:
          repo-name: debian-bootc
          signing-key: ${{ secrets.APT_GPG_KEY }}
          codename: trixie
          components: main
          architectures: amd64

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.create-apt-repo.outputs.dir }}

      # GitHub Pages deployments fail intermittently with "Deployment failed,
      # try again later." due to transient issues on the Pages service side
      # (see actions/deploy-pages issues #406 and #418). The error occurs
      # immediately after deployment creation, before any syncing status, and
      # is not caused by artifact conflicts, size, or workflow configuration.
      # Retrying within the same run (after a short backoff) reliably succeeds.
      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 2
        if: steps.deploy_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry 3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deploy_3
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Fail job if all deploy attempts failed
        if: steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure'
        run: |
          echo "::error::All 3 GitHub Pages deploy attempts failed. This is a transient issue on the GitHub Pages service side; re-run the workflow later."
          exit 1