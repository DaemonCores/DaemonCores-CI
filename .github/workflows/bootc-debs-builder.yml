name: Build & Publish Bootc .deb

# Generic, manifest-driven builder. One build job per call (the caller is
# already one call per arch) builds every package of the manifest in the order
# computed by build-deb/plan.py, so the container pull, the checkout and the
# manifest expansion are paid once instead of once per package. A package whose
# content hash is unchanged is restored from the APT repository, not rebuilt.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      arch:
        description: 'Target architecture (amd64 or arm64). Selects the build-env image and the packages built.'
        required: false
        type: string
        default: amd64
      signing_active:
        description: 'yes to sign .ko files; empty/no to skip. Forwarded to build-all.'
        required: false
        type: string
        default: 'no'
      unsigned_kernel:
        description: 'yes to also build the -nosign kernel twins (both signing mode); anything else drops them from the plan.'
        required: false
        type: string
        default: 'no'
      gpu_driver:
        description: 'yes to also build the packages marked when.gpu-driver (opt-in GPU entries, e.g. the proprietary NVIDIA libs; private build); anything else drops them.'
        required: false
        type: string
        default: 'no'
      deploy_pages:
        description: 'true to upload and deploy the APT repo to GitHub Pages. Set false when a separate debs_publish job handles deployment (prevents duplicate github-pages artifacts when amd64 and arm64 both run publish in the same workflow run).'
        required: false
        type: boolean
        default: true
    outputs:
      any_rebuilt:
        description: 'true if at least one package was rebuilt (not cache-reused).'
        value: ${{ jobs.publish.outputs.any_rebuilt }}

jobs:
  # Container images must be lowercase and the expression language has no
  # lowercase function, so the image reference is derived in a one-step job.
  image:
    runs-on: ubuntu-latest
    outputs:
      env_image: ${{ steps.ref.outputs.env_image }}
    steps:
      - id: ref
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          echo "env_image=ghcr.io/${GITHUB_REPOSITORY,,}:buildenv-${ARCH:-amd64}" \
            >>"$GITHUB_OUTPUT"

  build:
    needs: image
    name: Build all packages (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ needs.image.outputs.env_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.PAT_PKG || github.token }}
    permissions:
      contents: read
      # Pull the private build-env image with the job token when PAT_PKG is unset.
      packages: read
      # The Delete old artifacts step calls gh api DELETE on actions/artifacts,
      # which requires the actions: write scope on GITHUB_TOKEN.
      actions: write
      # Broken builds and guarded repack skips open issues.
      issues: write
    outputs:
      any_built: ${{ steps.build.outputs.any_built }}
    env:
      # Secret values a package may pull in via its manifest secret-env. A
      # secret absent from this repo resolves to an empty string (harmless).
      SECRETVAL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SECRETVAL_SB_SIGNING_KEY: ${{ secrets.SB_SIGNING_KEY }}
      SECRETVAL_SB_SIGNING_CERT: ${{ secrets.SB_SIGNING_CERT }}
      # Module signing key/cert, available to all module build scripts when
      # signing_active=yes; the build script checks MODULE_SIGNING_ACTIVE.
      MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
      MODULE_SIGNING_CERT: ${{ secrets.MODULE_SIGNING_CERT }}
      # Target arch propagates to the build-deb action and to deb globbing.
      BUILD_ARCH: ${{ inputs.arch }}
    steps:
      - uses: DaemonCores/DaemonCores-CI/bootc-debs-start@main

      # Expand variants and drop the other arch's packages once; the build
      # then works on plain packages.
      - name: Expand manifest variants
        id: expand
        uses: DaemonCores/DaemonCores-CI/manifest-expand@main
        with:
          arch: ${{ inputs.arch }}
          unsigned-kernel: ${{ inputs.unsigned_kernel == 'yes' && 'yes' || 'no' }}
          gpu-driver: ${{ inputs.gpu_driver == 'yes' && 'yes' || 'no' }}

      # Compiler cache for the kernel builds (objects overlap heavily between
      # the image kernel, its variants and the device modules). Restored once
      # for the whole job; build-all.sh installs and wires ccache only when a
      # kernel package really builds. The cache is not a build input.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-${{ inputs.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.arch }}-

      # continue-on-error so the artifact upload below still runs and the
      # last-good debs reach publish; the final step fails the job.
      - name: Build all packages
        id: build
        continue-on-error: true
        uses: DaemonCores/DaemonCores-CI/build-all@main
        with:
          manifest: ${{ steps.expand.outputs.manifest }}
          source-manifest: workflows/bootc-debs-builder/packages.yml
          arch: ${{ inputs.arch }}
          signing-active: ${{ inputs.signing_active }}

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache -s
          fi

      # Drop every previous per-package or combined artifact of this arch so
      # publish merges exactly one set of debs.
      - name: Delete old artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"debs-\") and endswith(\"-${ARCH}\")) | .id")
          for id in ${ids}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - name: Upload debs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debs-all-${{ inputs.arch }}
          path: /debs
          include-hidden-files: true

      # A failed package build kept its last-good deb (uploaded above) so the
      # publication still has an input, but the job must end red.
      - name: Fail the job on a broken build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::at least one package build failed; see the Build all packages step log"
          exit 1

  publish:
    needs: [build]
    # always() && !cancelled(): run even when the build job fails so that
    # hashes.json is updated for packages that succeeded. Without this,
    # a failed build blocks ALL packages from caching, causing every
    # package to rebuild on every run. Packages that failed without a prior
    # deb have no .meta file and are simply retried next run.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      any_rebuilt: ${{ steps.end.outputs.any_rebuilt }}
    steps:
      - id: repo
        shell: bash
        run: |
          name="${GITHUB_REPOSITORY##*/}"          # cut at the slash -> repo name
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"  # lowercase

      - id: end
        uses: DaemonCores/DaemonCores-CI/bootc-debs-end@main
        with:
          repo_name: ${{ steps.repo.outputs.name }}
          apt_gpg_key: ${{ secrets.APT_GPG_KEY }}
          skip_pages: ${{ !inputs.deploy_pages }}
          carry_over: ${{ needs.build.result != 'success' }}
