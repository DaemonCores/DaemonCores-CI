name: Kernel PVE + XanMod build (DEPRECATED)

# Kernel PVE + XanMod build
#
# DEPRECATED — the production path is the deb pipeline
# (DaemonCores-VE packages.yml, kernel-pve class entry, debs published to
# the APT repo like any other package). Keep this reusable workflow ONLY
# while the in-flight kernel validation lane drives its artifact-only
# nightly build through it; remove it once that lane lands so exactly ONE
# build path remains. The lib (kernel-pve/lib/kernel-pve-build.sh) is the
# single source of the build logic and is shared with the deb-lane entry.

# Reusable kernel build: the PVE kernel packaging (fetched with apt-get
# source on a Debian trixie container) with the XanMod patch set from the
# official upstream (manifest in the calling repo). Produces unsigned debs
# as artifacts — NEVER auto-installed on the PVE host; installing one is a
# separate, GO-gated operation on the host lane.
#
# Strategy (Gabriel, 30/10): TRANSVERSE variants, no rebuild per fine
# architecture. One amd64 job prepares ONE patched tree and packages the
# x64v1 (default) + x64v3 (+ optional x64v2) debs from it; the boot-time
# variant choice is a first-boot detection, not an install choice. One arm64
# job cross-compiles a single generic kernel.

on:
  workflow_call:
    inputs:
      manifest-repo:
        description: Repo carrying kernel-pve/patches.yml (owner/name)
        default: DaemonCores/DaemonCores-VE
        type: string
      manifest-ref:
        description: Ref of that repo to fetch the manifest from
        default: main
        type: string
      kernel-series:
        description: XanMod series directory suffix, e.g. 7.3
        default: "7.3"
        type: string
      kernel-version:
        description: Full kernel version of the PVE packaging, e.g. 7.3.0
        default: ""
        type: string
      x86-flavours:
        description: Space-separated x86 flavours built from one tree
        default: "x64v1 x64v3"
        type: string
      gpu-sets:
        description: >
          Space-separated GPU config sets merged as modules from
          kconfig/gpu/ (`all` is every fragment of that directory). The
          transverse vendor support is ONE kernel build, not a matrix.
        default: "all"
        type: string

permissions:
  contents: read

jobs:
  x86:
    name: amd64 (${{ inputs.x86-flavours }})
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.manifest-repo }}
          ref: ${{ inputs.manifest-ref }}
          sparse-checkout: |
            workflows/bootc-debs-builder/kernel-pve

      - name: Resolve the kernel version of the PVE packaging
        id: resolve
        run: |
          VER="${{ inputs.kernel-version }}"
          if [ -z "${VER}" ]; then
            VER=$(docker run --rm debian:trixie bash -c \
              'echo "deb [arch=amd64] https://download.proxmox.com/debian/pve trixie pve-no-subscription" \
                 > /etc/apt/sources.list.d/pve.list \
                 && echo "deb-src [arch=amd64] https://download.proxmox.com/debian/pve trixie pve-no-subscription" \
                      >> /etc/apt/sources.list.d/pve.list \
                 && curl -fsSL https://download.proxmox.com/debian/proxmox-release-trixie.gpg \
                      -o /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg \
                 && apt-get update -qq \
                 && apt-cache policy proxmox-kernel-7.0 | sed -n 2p | awk "{print \$2}"')
          fi
          test -n "${VER}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

      - name: Build the patched tree and all x86 flavour debs
        run: |
          docker run --rm -v "$(pwd)/out:/out" -v "$(pwd):/src:ro" \
            -e KERNEL_SERIES="${{ inputs.kernel-series }}" \
            -e KERNEL_VERSION="${{ steps.resolve.outputs.version }}" \
            -e KERNEL_FLAVOURS="${{ inputs.x86-flavours }}" \
            -e KERNEL_GPU="${{ inputs.gpu-sets }}" \
            -e KERNEL_ARCH=x86_64 \
            debian:trixie bash \
            /src/workflows/bootc-debs-builder/kernel-pve/lib/kernel-pve-build.sh

      - name: Upload the debs
        uses: actions/upload-artifact@v4
        with:
          name: pve-xanmod-kernel-x86
          path: out/*.deb
          if-no-files-found: error

  arm64:
    name: arm64 (single build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.manifest-repo }}
          ref: ${{ inputs.manifest-ref }}
          sparse-checkout: |
            workflows/bootc-debs-builder/kernel-pve

      - name: Resolve the kernel version of the PVE packaging
        id: resolve
        run: |
          VER="${{ inputs.kernel-version }}"
          if [ -z "${VER}" ]; then
            VER=$(docker run --rm --platform linux/amd64 debian:trixie bash -c \
              'echo "deb [arch=amd64] https://download.proxmox.com/debian/pve trixie pve-no-subscription" \
                 > /etc/apt/sources.list.d/pve.list \
                 && curl -fsSL https://download.proxmox.com/debian/proxmox-release-trixie.gpg \
                      -o /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg \
                 && apt-get update -qq \
                 && apt-cache policy proxmox-kernel-7.0 | sed -n 2p | awk "{print \$2}"')
          fi
          test -n "${VER}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"

      - name: Cross-compile the arm64 kernel deb
        run: |
          docker run --rm -v "$(pwd)/out:/out" -v "$(pwd):/src:ro" \
            -e KERNEL_SERIES="${{ inputs.kernel-series }}" \
            -e KERNEL_VERSION="${{ steps.resolve.outputs.version }}" \
            -e KERNEL_GPU="${{ inputs.gpu-sets }}" \
            -e KERNEL_ARCH=arm64 \
            debian:trixie bash \
            /src/workflows/bootc-debs-builder/kernel-pve/lib/kernel-pve-build.sh

      - name: Upload the deb
        uses: actions/upload-artifact@v4
        with:
          name: pve-xanmod-kernel-arm64
          path: out/*.deb
          if-no-files-found: error
