name: Container Image CI

on:
  workflow_call:
    inputs:
      force_no_cache:
        description: 'Force a --no-cache image rebuild (e.g. a .deb changed).'
        type: boolean
        required: false
        default: false
      bootc_gpg_sha256:
        description: >-
          SHA-256 of the published APT public key, derived by the pipeline from
          the APT_GPG_KEY secret. Empty keeps the Containerfile default.
        type: string
        required: false
        default: ''
      apt_url:
        description: 'Base URL of the published APT repository (empty keeps the Containerfile default).'
        type: string
        required: false
        default: ''
      nosign_images:
        description: >-
          Also build the unsigned-kernel twin (tag `<tag>-nosign`) of every
          Containerfile carrying `LABEL org.daemoncores.unsigned-kernel-image`.
          Used by the both signing mode; the twin installs the -nosign kernel
          from the same APT suite as the primary image. The twin is built in the
          same job as its primary image, on the same layers: only the kernel
          layer and the ones after it are rebuilt. Without this input the twin
          is neither built nor pushed.
        type: boolean
        required: false
        default: false
      gpu_driver_images:
        description: >-
          Also build the `-nvidia` twin (tag `<tag>-nvidia`) of every
          Containerfile carrying `LABEL org.daemoncores.nvidia-image`: the
          same image plus the NVIDIA proprietary user-space (GPU_EXTRA_PKGS,
          EULA accepted at install time). Without this input the twin is
          neither built nor pushed; a push never sets it.
        type: boolean
        required: false
        default: false

jobs:
  # Discover every Containerfile* at the repo root and emit a FLAT build
  # matrix where each entry is { file, tag, arch, kernel_suffix, twin_suffix }. Both arches
  # (amd64, arm64) are always included. There is one image per tag: automatic
  # updates are a run-time choice (the bootc-fetch-apply-updates.timer, masked
  # through a symlink in /etc), not an image variant.
  # A Containerfile that carries `LABEL org.daemoncores.arm64-4k-image` ships two
  # arm64 kernels because the page size is a compile-time choice and one image
  # holds one kernel. The plain tag is the 16 KB kernel (kernel_suffix `-16k`)
  # for recent hardware; a second, arm64-only image tagged `<tag>-4k`
  # (kernel_suffix empty) serves the older devices (Raspberry Pi 3 and 4) whose
  # cores have no 16 KB granule. Without the LABEL, arm64 builds the 4 KB kernel.
  # Containerfile.base is the shared base every other Containerfile builds on: it is
  # not an image of its own (no matrix entry, never pushed) but it takes part in the
  # global hash. Each build job builds it once, then the image and its -nosign twin
  # (`twin_suffix`, the kernel suffix of the twin, empty when none is requested).
  # Also computes a global hash over all Containerfiles so any variant change
  # invalidates every variant's "identical to previous" cache.
  #
  # A second output, manifest_matrix, lists the unique tags with the `arches`
  # the manifest list covers (both for a regular tag, arm64 only for a `-4k`
  # tag).
  discover:
    name: Discover Containerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix_wave1: ${{ steps.list.outputs.matrix_wave1 }}
      matrix_wave2: ${{ steps.list.outputs.matrix_wave2 }}
      has_derived: ${{ steps.list.outputs.has_derived }}
      manifest_matrix: ${{ steps.list.outputs.manifest_matrix }}
      global_hash: ${{ steps.list.outputs.global_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List Containerfiles and build matrix
        id: list
        env:
          NOSIGN_IMAGES: ${{ inputs.nosign_images }}
          GPU_DRIVER_IMAGES: ${{ inputs.gpu_driver_images }}
        run: |
          set -euo pipefail
          # Find every Containerfile* at the repo root (maxdepth 1). Sorted for
          # deterministic ordering across runs.
          mapfile -t files < <(find . -maxdepth 1 -type f -name 'Containerfile*' \
            | sed 's|^\./||' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Containerfile found at repo root." >&2
            exit 1
          fi
          matrix='[]'
          manifest_matrix='[]'
          global_inputs=""
          for name in "${files[@]}"; do
            if [[ "$name" == "Containerfile.base" ]]; then
              global_inputs+="${name} $(sha256sum "$name" | cut -d' ' -f1)"$'\n'
              continue
            fi
            if [[ "$name" == "Containerfile" ]]; then
              tag="latest"
            else
              tag="${name#Containerfile.}"
            fi
            # A Containerfile with the 4 KB image LABEL builds the 16 KB kernel on the
            # plain arm64 tag; otherwise arm64 stays on the 4 KB kernel.
            has_4k=false
            if grep -qE '^[[:space:]]*LABEL[[:space:]]+org\.daemoncores\.arm64-4k-image' "$name"; then
              has_4k=true
            fi
            # The unsigned-kernel twin (both signing mode): the same image on
            # the -nosign kernel package, for the generic images only. It is built
            # by the job of its primary image, on shared layers. The 4 KB arm64
            # image serves U-Boot devices without secure boot and has no twin;
            # neither does an arm64 image that builds the 4 KB kernel.
            has_twin=false
            if [[ "${NOSIGN_IMAGES}" == "true" ]] && grep -qE '^[[:space:]]*LABEL[[:space:]]+org\.daemoncores\.unsigned-kernel-image' "$name"; then
              has_twin=true
            fi
            # The -nvidia twin (opt-in): the same layers plus the NVIDIA
            # proprietary user-space (GPU_EXTRA_PKGS build-arg, EULA enforced
            # at install time by the bootc-installer). It leaves the matrix
            # unless the caller enables gpu_driver_images, so a plain push
            # never builds or publishes an EULA-restricted artefact.
            has_nvidia=false
            if [[ "${GPU_DRIVER_IMAGES:-}" == "true" ]] && grep -qE '^[[:space:]]*LABEL[[:space:]]+org\.daemoncores\.nvidia-image' "$name"; then
              has_nvidia=true
            fi
            twin_arches='[]'
            for arch in amd64 arm64; do
              suffix=""
              twin_suffix=""
              if [[ "$arch" == "arm64" && "$has_4k" == "true" ]]; then
                suffix="-16k"
              fi
              if [[ "$has_twin" == "true" && ( "$arch" == "amd64" || "$has_4k" == "true" ) ]]; then
                twin_suffix="${suffix}-nosign"
                twin_arches=$(printf '%s' "$twin_arches" | jq -c --arg a "$arch" '. += [$a]')
              fi
              matrix=$(printf '%s' "$matrix" | jq -c \
                --arg file "$name" --arg tag "$tag" --arg arch "$arch" \
                --arg ks "$suffix" --arg ts "$twin_suffix" \
                --argjson nv "$has_nvidia" \
                '. += [{file: $file, tag: $tag, arch: $arch, kernel_suffix: $ks, twin_suffix: $ts, nvidia: $nv}]')
            done
            manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c \
              --arg tag "$tag" \
              '. += [{tag: $tag, arches: ["amd64", "arm64"]}]')
            # The 4 KB arm64 kernel image for the older devices, when the
            # Containerfile asks for it.
            if [[ "$has_4k" == "true" ]]; then
              matrix=$(printf '%s' "$matrix" | jq -c \
                --arg file "$name" --arg tag "${tag}-4k" \
                '. += [{file: $file, tag: $tag, arch: "arm64", kernel_suffix: "", twin_suffix: ""}]')
              manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c \
                --arg tag "${tag}-4k" \
                '. += [{tag: $tag, arches: ["arm64"]}]')
            fi
            if [[ "$has_nvidia" == "true" ]]; then
              manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c \
                --arg tag "${tag}-nvidia" \
                '. += [{tag: $tag, arches: ["amd64", "arm64"]}]')
            fi
            if [[ "$twin_arches" != '[]' ]]; then
              manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c \
                --arg tag "${tag}-nosign" --argjson arches "$twin_arches" \
                '. += [{tag: $tag, arches: $arches}]')
            fi
            global_inputs+="${name} $(sha256sum "$name" | cut -d' ' -f1)"$'\n'
          done
          global_hash=$(printf '%s' "$global_inputs" | sha256sum | cut -d' ' -f1)
          # Split into wave1 (FROM external) and wave2 (FROM our own registry).
          # Containerfiles that pull a previously-built image from this run
          # (e.g. Containerfile.iso: FROM ghcr.io/daemoncores/debian-bootc:latest-*)
          # must run AFTER wave1 pushes, not concurrently with it.
          owner="${GITHUB_REPOSITORY%%/*}"
          matrix_wave1='[]'
          matrix_wave2='[]'
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            file=$(printf '%s' "$entry" | jq -r '.file')
            from_line=$(grep -m1 -iE '^FROM ' "$file" | awk '{print $2}' || true)
            if printf '%s' "$from_line" | grep -qi "ghcr\.io/${owner}/"; then
              matrix_wave2=$(printf '%s' "$matrix_wave2" | jq -c --argjson e "$entry" '. += [$e]')
            else
              matrix_wave1=$(printf '%s' "$matrix_wave1" | jq -c --argjson e "$entry" '. += [$e]')
            fi
          done < <(printf '%s' "$matrix" | jq -c '.[]')
          has_derived="false"
          [ "$matrix_wave2" != '[]' ] && has_derived="true"
          echo "matrix_wave1=$(printf '%s' "$matrix_wave1" | jq -c .)" >>"$GITHUB_OUTPUT"
          echo "matrix_wave2=$(printf '%s' "$matrix_wave2" | jq -c .)" >>"$GITHUB_OUTPUT"
          echo "has_derived=${has_derived}" >>"$GITHUB_OUTPUT"
          echo "manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c .)" >>"$GITHUB_OUTPUT"
          echo "global_hash=${global_hash}" >>"$GITHUB_OUTPUT"
          echo "Wave 1 matrix (external FROM):"
          printf '%s' "$matrix_wave1" | jq .
          echo "Wave 2 matrix (derived FROM our registry):"
          printf '%s' "$matrix_wave2" | jq .
          echo "Manifest matrix:"
          printf '%s' "$manifest_matrix" | jq .
          echo "Global Containerfiles hash: ${global_hash}"

  build-test-push:
    name: Build ${{ matrix.entry.tag }}-${{ matrix.entry.arch }}
    needs: discover
    runs-on: ${{ matrix.entry.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      # Lets the duplicate-image guard open/append a "suspicious pipeline" issue.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # Flat matrix: each entry is { file, tag, arch, kernel_suffix, twin_suffix }. The
        # arch dimension (amd64/arm64) is folded in by the discover job. Both
        # arches always build natively on their matching runner (no QEMU
        # cross-build).
        entry: ${{ fromJSON(needs.discover.outputs.matrix_wave1) }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name and tags
        id: tags
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
          TWIN_SUFFIX: ${{ matrix.entry.twin_suffix }}
          NVIDIA: ${{ matrix.entry.nvidia }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Per-arch tag <tag>_<arch>. No device segment (the kernel modules
          # are selected per-arch inside the Containerfile instead of being a
          # build dimension).
          primary="${CF_TAG}_${ARCH}"
          echo "primary=${primary}" >>"$GITHUB_OUTPUT"
          # The unsigned-kernel twin of this image, when one is requested.
          if [[ -n "${TWIN_SUFFIX}" ]]; then
            echo "twin_tag=${CF_TAG}-nosign" >>"$GITHUB_OUTPUT"
            echo "twin_primary=${CF_TAG}-nosign_${ARCH}" >>"$GITHUB_OUTPUT"
          fi
          # The -nvidia twin of this image, when the discoverer planned it.
          if [[ "${NVIDIA}" == "true" ]]; then
            echo "nvidia_tag=${CF_TAG}-nvidia" >>"$GITHUB_OUTPUT"
            echo "nvidia_primary=${CF_TAG}-nvidia_${ARCH}" >>"$GITHUB_OUTPUT"
          fi
          # Canonical combo = amd64. Only this one keeps the
          # historical tags (:latest / :<sha> / :monthly-*) for retrocompat
          # with the single-arch era, so existing amd64 pulls/tags keep
          # working.
          canonical=false
          if [ "$ARCH" = "amd64" ]; then canonical=true; fi
          echo "canonical=${canonical}" >>"$GITHUB_OUTPUT"
          echo "ARCH=${ARCH}" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG || github.token }}
        run: |
          set -euo pipefail
          # Login Podman for build and push with podman fonctionality and for bootc standard
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

          # Login Docker because github signe container with docker and not podman
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      # Deterministic content id of what actually goes into the image: the
      # published deb hashes + the base image digest (per-arch) + this variant's
      # Containerfile + the global Containerfiles hash + the arch + the
      # Stamped as a label so the next run can tell whether a rebuild changed
      # anything. The arch is part of the id so cross-arch images get distinct
      # cache identities.
      - name: Compute content hash
        id: chash
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          GLOBAL_HASH: ${{ needs.discover.outputs.global_hash }}
          ARCH: ${{ matrix.entry.arch }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          BOOTC_GPG_SHA256: ${{ inputs.bootc_gpg_sha256 }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 \
            || { sudo apt-get update -qq; sudo apt-get install -y skopeo; }
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pages="https://${owner,,}.github.io/${repo}"
          debs=$(curl -fsSL "${pages}/debs-cache/hashes.json" 2>/dev/null \
            | jq -cS . 2>/dev/null || echo '{}')
          # The external base image is the one Containerfile.base starts from.
          base=$(grep -m1 -iE '^FROM ' Containerfile.base | awk '{ print $2 }')
          # Resolve the base image's per-arch digest (--override-arch) so amd64
          # and arm64 get distinct, correct digests even when the base is a
          # multi-arch manifest list.
          base_digest=$(sudo skopeo inspect --override-arch "${ARCH}" \
            --format '{{.Digest}}' "docker://${base}" 2>/dev/null || echo none)
          cf=$(sha256sum "$CF_FILE" | cut -d' ' -f1)
          # The APT key hash and the signing public key are build inputs too:
          # a rotation must not be mistaken for an identical image.
          signing=$(printf '%s\n%s' "${BOOTC_GPG_SHA256}" "${COSIGN_PUBLIC_KEY}" \
            | sha256sum | cut -d' ' -f1)
          hash=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "${debs}" "${base_digest}" "${cf}" "${GLOBAL_HASH}" "${CF_TAG}" \
            "${ARCH}" "${signing}" \
            | sha256sum | cut -d' ' -f1)
          echo "hash=${hash}" >>"$GITHUB_OUTPUT"
          # The twin differs from its primary image by the kernel only.
          twin_hash=$(printf '%s\nnosign\n' "${hash}" | sha256sum | cut -d' ' -f1)
          echo "twin_hash=${twin_hash}" >>"$GITHUB_OUTPUT"
          # The -nvidia twin differs from its primary image by the GPU layer
          # only (the GPU_EXTRA_PKGS build-arg); the layer itself is opaque,
          # so its identity is the extra "nvidia" salt.
          nvidia_hash=$(printf '%s\nnvidia\n' "${hash}" | sha256sum | cut -d' ' -f1)
          echo "nvidia_hash=${nvidia_hash}" >>"$GITHUB_OUTPUT"
          # Content-hash label of the currently published per-arch image.
          prior=$(sudo skopeo inspect --override-arch "${ARCH}" \
            --format '{{ index .Labels "org.daemoncores.content-hash" }}' \
            "docker://${IMAGE}:${PRIMARY}" 2>/dev/null || echo '')
          if [[ -n "${prior}" && "${prior}" == "${hash}" ]]; then
            echo "identical=true" >>"$GITHUB_OUTPUT"
          else
            echo "identical=false" >>"$GITHUB_OUTPUT"
          fi
          echo "content-hash=${hash} prior=${prior:-none} tag=${PRIMARY}"

      # The shared base (SSL prerequisites, trusted bootc APT repository) is built
      # once per job. It stays local to the runner: it is never pushed. The image and
      # its -nosign twin are built on it, so they share every layer before the kernel.
      - name: Build base
        env:
          ARCH: ${{ matrix.entry.arch }}
          BOOTC_GPG_SHA256: ${{ inputs.bootc_gpg_sha256 }}
          APT_URL: ${{ inputs.apt_url }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ github.event_name }}" == "schedule" \
            || "${{ inputs.force_no_cache }}" == "true" ]]; then
            flags+=(--no-cache)
          fi
          # APT repository trust: the key hash is derived by the pipeline from
          # the APT_GPG_KEY secret; when absent the Containerfile defaults apply.
          apt_args=()
          [[ -z "${BOOTC_GPG_SHA256}" ]] \
            || apt_args+=(--build-arg "BOOTC_GPG_SHA256=${BOOTC_GPG_SHA256}")
          [[ -z "${APT_URL}" ]] \
            || apt_args+=(--build-arg "BOOTC_APT_URL=${APT_URL}")
          # Product display name, derived automatically from the repo name (same
          # rule as the ISO branding: repo tail, dashes -> spaces). The image
          # brands its UEFI boot-entry label with it instead of a hardcoded
          # distro name.
          product_name="${GITHUB_REPOSITORY##*/}"
          product_name="${product_name//-/ }"
          # Layer cache in the registry: read on every run, rewritten only on main.
          # --no-cache (monthly cron or force_no_cache) skips the lookup so the
          # packages are refreshed, and the fresh layers still replace the cache.
          cache=(--layers "--cache-from=${IMAGE}-cache-${ARCH}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cache+=("--cache-to=${IMAGE}-cache-${ARCH}")
          fi
          _bld_log=$(mktemp /tmp/podman-base-XXXXXX.log)
          if ! sudo podman build \
              "${flags[@]}" "${cache[@]}" \
              --build-arg "ARCH=${ARCH}" \
              --build-arg "PRODUCT_NAME=${product_name}" \
              "${apt_args[@]}" \
              --tag localhost/debian-bootc-base \
              -f Containerfile.base \
              --format docker \
              . 2>&1 | tee "${_bld_log}"; then
            if grep -qE "image not known|locating image with ID" "${_bld_log}"; then
              echo "::warning::buildah cache push failed (stale storage blob), retrying base build without --cache-to"
              local_cache_ro=(--layers "--cache-from=${IMAGE}-cache-${ARCH}")
              sudo podman build \
                "${flags[@]}" "${local_cache_ro[@]}" \
                --build-arg "ARCH=${ARCH}" \
                --build-arg "PRODUCT_NAME=${product_name}" \
                "${apt_args[@]}" \
                --tag localhost/debian-bootc-base \
                -f Containerfile.base \
                --format docker \
                .
            else
              exit 1
            fi
          fi
          rm -f "${_bld_log}"

      - name: Build
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
          KERNEL_SUFFIX: ${{ matrix.entry.kernel_suffix }}
          TWIN_SUFFIX: ${{ matrix.entry.twin_suffix }}
          NVIDIA: ${{ matrix.entry.nvidia }}
          NVIDIA_HASH: ${{ steps.chash.outputs.nvidia_hash }}
          GPU_EXTRA_PKGS: ${{ vars.NVIDIA_EXTRA_PKGS || 'nvidia-driver nvidia-kernel-dkms' }}
          CANONICAL: ${{ steps.tags.outputs.canonical }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          HASH: ${{ steps.chash.outputs.hash }}
          TWIN_HASH: ${{ steps.chash.outputs.twin_hash }}
        run: |
          set -euo pipefail
          nocache=()
          if [[ "${{ github.event_name }}" == "schedule" \
            || "${{ inputs.force_no_cache }}" == "true" ]]; then
            nocache+=(--no-cache)
          fi

          # Build one image: $1 = tag (the Containerfile tag, or `<tag>-nosign` for the
          # twin), $2 = kernel suffix, $3 = content hash, then the build flags.
          build_one() {
            local tag="$1" kernel_suffix="$2" hash="$3"
            shift 3
            local flags=("$@")
            # Layer cache in the registry: read on every run, rewritten only on main.
            # --no-cache (monthly cron or force_no_cache) skips the lookup so the
            # packages are refreshed, and the fresh layers still replace the cache.
            local cache=(--layers "--cache-from=${IMAGE}-cache-${ARCH}")
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              cache+=("--cache-to=${IMAGE}-cache-${ARCH}")
            fi

            # Monthly tag: 'monthly-YYYYMMDD' for the canonical latest combo only
            # (preserves the historical amd64-only monthly tag).
            if [[ "${{ github.event_name }}" == "schedule" && "$CANONICAL" == "true" ]]; then
              if [[ "$tag" == "latest" ]]; then
                flags+=(--tag "${IMAGE}:monthly-$(date -u +%Y%m%d)")
              else
                flags+=(--tag "${IMAGE}:${tag}-monthly-$(date -u +%Y%m%d)")
              fi
            fi

            # SHA tag (retrocompat with the single-Containerfile era): bare '<sha>'
            # for latest canonical, '<tag>-<sha>' for non-latest canonical. Only the
            # canonical combo (amd64) produces a SHA tag to preserve
            # the historical amd64 sha tag as a single-arch artifact.
            if [[ "$CANONICAL" == "true" ]]; then
              local sha
              sha=$(git rev-parse --short HEAD)
              if [[ "$tag" == "latest" ]]; then
                flags+=(--tag "${IMAGE}:${sha}")
              else
                flags+=(--tag "${IMAGE}:${tag}-${sha}")
              fi
              # Canonical combo also keeps the bare :latest / :<variant> tag pointing
              # at the amd64 image (retrocompat: an amd64 pull of :latest
              # gets the amd64 image directly, before the manifest list job promotes
              # it to a multi-arch manifest).
              flags+=(--tag "${IMAGE}:${tag}")
            fi

            # Pass ARCH so the Containerfile selects the right kernel metapackage
            # (linux-image-${ARCH}), boot stack, firmware set, and module path.
            # The boot stack follows the architecture AND the boot profile, which
            # a Containerfile declares with `LABEL org.daemoncores.boot-profile`
            # (generic when absent):
            #   amd64            grub-efi-amd64-signed (Fedora GRUB)
            #   arm64 generic    grub-efi-arm64-signed (Fedora GRUB): PCs, servers
            #                    and VMs booting through UEFI
            #   arm64 embedded   u-boot-tools, no GRUB: boards and phones whose
            #                    firmware loads U-Boot (Raspberry Pi, SBCs)
            # FIRMWARE_PKGS for arm64 drops the x86 microcode blobs.
            local profile=generic boot_pkg apt_hold_pkg firmware_pkgs
            if grep -qE '^[[:space:]]*LABEL[[:space:]]+org\.daemoncores\.boot-profile=.?embedded' "$CF_FILE"; then
              profile=embedded
            fi
            if [[ "${ARCH}" == "arm64" ]]; then
              firmware_pkgs="firmware-linux-free firmware-linux firmware-misc-nonfree"
              if [[ "${profile}" == "embedded" ]]; then
                boot_pkg="u-boot-tools"
                apt_hold_pkg=""
              else
                boot_pkg="grub-efi-arm64-signed"
                apt_hold_pkg="grub-efi-arm64-signed"
              fi
            else
              boot_pkg="grub-efi-amd64-signed"
              firmware_pkgs="intel-microcode amd64-microcode firmware-linux-free firmware-linux firmware-misc-nonfree"
              apt_hold_pkg="grub-efi-amd64-signed"
            fi
            # arm64 ships two kernels (debian-bootc wiki docs/Handoff-Decisions.md,
            # "Two arm64 kernels"): the
            # 16 KB one on the plain tag for recent hardware (Raspberry Pi 5,
            # RK3588), the 4 KB one (`-4k` image) for the older devices (Raspberry
            # Pi 3 and 4). The
            # suffix completes the kernel package name; ARM_DEVICES lists the
            # device module packages built against that kernel. Both mirror the
            # variants of linux-modules-arm-device in the package manifest.
            local arm_devices="rpi3 rpi4"
            if [[ "${kernel_suffix}" == -16k* ]]; then
              arm_devices="rpi5 rk3588"
            fi
            local build_args=(
              --build-arg "BASE_IMAGE=localhost/debian-bootc-base"
              --build-arg "ARCH=${ARCH}"
              --build-arg "KERNEL_SUFFIX=${kernel_suffix}"
              --build-arg "ARM_DEVICES=${arm_devices}"
              --build-arg "BOOT_PKG=${boot_pkg}"
              --build-arg "BOOT_PROFILE=${profile}"
              --build-arg "FIRMWARE_PKGS=${firmware_pkgs}"
              --build-arg "APT_HOLD_PKG=${apt_hold_pkg}"
              # The -nvidia twin only: the EULA-restricted packages listed
              # by the caller; the public build keeps the arg empty.
              --build-arg "GPU_EXTRA_PKGS=$( [[ "$tag" == *-nvidia ]] && printf '%s' "${GPU_EXTRA_PKGS:-}" || printf '' )"
              --build-arg "COSIGN_PUBKEY_B64=$(printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 -w0)"
              --build-arg "IMAGE_REF=${IMAGE,,}"
              --label "org.daemoncores.content-hash=${hash}"
              --tag "${IMAGE}:${tag}_${ARCH}"
              -f "$CF_FILE"
              --format docker
              .
            )
            local _bld_log
            _bld_log=$(mktemp /tmp/podman-build-XXXXXX.log)
            if ! sudo podman build "${flags[@]}" "${cache[@]}" "${build_args[@]}" \
                2>&1 | tee "${_bld_log}"; then
              if grep -qE "image not known|locating image with ID" "${_bld_log}"; then
                echo "::warning::buildah cache push failed (stale storage blob), retrying without --cache-to"
                local cache_ro=(--layers "--cache-from=${IMAGE}-cache-${ARCH}")
                sudo podman build "${flags[@]}" "${cache_ro[@]}" "${build_args[@]}"
              else
                exit 1
              fi
            fi
            rm -f "${_bld_log}"
          }

          build_one "${CF_TAG}" "${KERNEL_SUFFIX}" "${HASH}" "${nocache[@]}"
          # The twin reuses the layers the image just built, up to the kernel: no
          # --no-cache here, or the sharing would be thrown away.
          if [[ -n "${TWIN_SUFFIX}" ]]; then
            build_one "${CF_TAG}-nosign" "${TWIN_SUFFIX}" "${TWIN_HASH}"
          fi
          # The -nvidia twin reuses the same layers: only the GPU layer and
          # the ones after it are rebuilt.
          if [[ "${NVIDIA}" == "true" ]]; then
            build_one "${CF_TAG}-nvidia" "${KERNEL_SUFFIX}" "${NVIDIA_HASH}"
          fi

      - name: Check runtime deps
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE}:${PRIMARY}" \
            sh -c "ldd /usr/bin/bootc && ldd /usr/lib/libostree-1.so*"

      - name: Smoke test
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE}:${PRIMARY}" bootc container lint

      - name: Smoke test the unsigned-kernel twin
        if: steps.tags.outputs.twin_primary != ''
        env:
          TWIN: ${{ steps.tags.outputs.twin_primary }}
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE}:${TWIN}" bootc container lint

      # Real boot test: install to a disk, boot under QEMU/KVM, run the repo's
      # image-tests over SSH. A failure fails this job, so Push never runs.
      # Skipped for the installer image (tag=iso): it is a live graphical
      # installer with no SSH server, so the boot-test infrastructure cannot
      # connect. The installer image is validated by bootc container lint only.
      - name: Boot-test the image
        if: matrix.entry.tag != 'iso'
        uses: DaemonCores/DaemonCores-CI/image-test@main
        with:
          image: ${{ env.IMAGE }}:${{ steps.tags.outputs.primary }}
          arch: ${{ matrix.entry.arch }}

      - name: Boot-test the unsigned-kernel twin
        if: steps.tags.outputs.twin_primary != ''
        uses: DaemonCores/DaemonCores-CI/image-test@main
        with:
          image: ${{ env.IMAGE }}:${{ steps.tags.outputs.twin_primary }}
          arch: ${{ matrix.entry.arch }}

      # Report-only vulnerability scan (exit-code 0: never fails the build).
      # Output goes to the job summary only, no artifact. Switch exit-code to 1
      # with severity CRITICAL once the baseline is known to be clean.
      - name: Save image for vulnerability scan
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman save --format docker-archive -o /tmp/scan-image.tar "${IMAGE}:${PRIMARY}"
          sudo chmod 644 /tmp/scan-image.tar

      - name: Scan image for vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/scan-image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Remove scan archive
        if: always()
        run: sudo rm -f /tmp/scan-image.tar

      # Only the images this run asked for are pushed: the image and, when requested,
      # its unsigned-kernel twin. The shared base is never pushed.
      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          TWIN_TAG: ${{ steps.tags.outputs.twin_tag }}
          ARCH: ${{ matrix.entry.arch }}
          CANONICAL: ${{ steps.tags.outputs.canonical }}
        run: |
          set -euo pipefail
          push_one() {
            local tag="$1" primary="${1}_${ARCH}" sha
            # Per-arch tag (always).
            sudo podman push --digestfile /tmp/digest_primary.txt "${IMAGE}:${primary}"
            echo "${IMAGE,,}@$(cat /tmp/digest_primary.txt)" >> /tmp/push_refs.txt
            # Canonical combo preserves the historical tags.
            if [[ "$CANONICAL" == "true" ]]; then
              sudo podman push "${IMAGE}:${tag}"
              sha=$(git rev-parse --short HEAD)
              if [[ "$tag" == "latest" ]]; then
                sudo podman push "${IMAGE}:${sha}"
              else
                sudo podman push "${IMAGE}:${tag}-${sha}"
              fi
              if [[ "${{ github.event_name }}" == "schedule" ]]; then
                if [[ "$tag" == "latest" ]]; then
                  sudo podman push "${IMAGE}:monthly-$(date -u +%Y%m%d)"
                else
                  sudo podman push "${IMAGE}:${tag}-monthly-$(date -u +%Y%m%d)"
                fi
              fi
            fi
          }
          : > /tmp/push_refs.txt
          push_one "${CF_TAG}"
          [[ -z "${TWIN_TAG}" ]] || push_one "${TWIN_TAG}"
          {
            echo "refs<<EOF"
            cat /tmp/push_refs.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign image
        if: github.ref == 'refs/heads/main'
        uses: DaemonCores/DaemonCores-CI/sign-image@main
        with:
          refs: ${{ steps.push.outputs.refs }}
          private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PASSWORD }}

      # The image was built, pushed and signed but its content is byte-identical
      # to what was already published (same debs + base + Containerfiles + arch).
      # Report it as a suspicious/wasteful run without failing
      # the pipeline. One issue per variant-arch combo (title keyed by
      # the primary tag) so each combo's status is visible.
      - name: Flag identical image
        if: github.ref == 'refs/heads/main' && steps.chash.outputs.identical == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          hash="${{ steps.chash.outputs.hash }}"
          {
            echo "### ⚠️ Image identique à la précédente (\`${PRIMARY}\`)"
            echo
            echo "Le pipeline a reconstruit, poussé **et signé** une image dont le"
            echo "content-hash \`${hash}\` est identique à celle déjà publiée (tag \`${PRIMARY}\`) :"
            echo "ni les .deb, ni l'image de base, ni les Containerfiles, ni l'arch n'ont changé."
            echo "Le rebuild/push/signature était probablement inutile."
          } >>"$GITHUB_STEP_SUMMARY"
          title="⚠️ Pipeline douteuse : image identique poussée (${PRIMARY})"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number -q '.[0].number' \
            2>/dev/null || true)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
              --body "Run \`${GITHUB_RUN_ID}\` : image identique (tag \`${PRIMARY}\`, hash \`${hash}\`)." \
              2>/dev/null || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Content-hash \`${hash}\` inchangé pour le tag \`${PRIMARY}\` mais image reconstruite, poussée et signée (run \`${GITHUB_RUN_ID}\`)." \
              2>/dev/null || true
          fi

  # Wave 2: Containerfiles whose FROM references an image built in wave 1
  # (e.g. Containerfile.iso pulls latest_<arch> which wave 1 just
  # pushed). Runs only after build-test-push succeeds so the base image exists.
  build-iso:
    name: Build ${{ matrix.entry.tag }}-${{ matrix.entry.arch }} (wave 2)
    needs: [discover, build-test-push]
    if: ${{ !cancelled() && needs.discover.outputs.has_derived == 'true' && needs.build-test-push.result == 'success' }}
    runs-on: ${{ matrix.entry.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.matrix_wave2) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set image name and tags
        id: tags
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          primary="${CF_TAG}_${ARCH}"
          echo "primary=${primary}" >>"$GITHUB_OUTPUT"
          canonical=false
          if [ "$ARCH" = "amd64" ]; then canonical=true; fi
          echo "canonical=${canonical}" >>"$GITHUB_OUTPUT"
          echo "ARCH=${ARCH}" >>"$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG || github.token }}
        run: |
          set -euo pipefail
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"
      - name: Build
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          CANONICAL: ${{ steps.tags.outputs.canonical }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ github.event_name }}" == "schedule" \
            || "${{ inputs.force_no_cache }}" == "true" ]]; then
            flags+=(--no-cache)
          fi
          product_name="${GITHUB_REPOSITORY##*/}"
          product_name="${product_name//-/ }"
          # Layer cache: same rules as the wave 1 builds.
          cache=(--layers "--cache-from=${IMAGE}-cache-${ARCH}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cache+=("--cache-to=${IMAGE}-cache-${ARCH}")
          fi
          sudo podman build \
            --arch "${ARCH}" \
            --build-arg ARCH="${ARCH}" \
            --build-arg COSIGN_PUBKEY_B64="$(printf '%s' "${COSIGN_PUBLIC_KEY}" | base64 -w0)" \
            --build-arg IMAGE_REF="${IMAGE,,}" \
            --build-arg PRODUCT_NAME="${product_name}" \
            --label "org.daemoncores.content-hash=wave2-${PRIMARY}" \
            --tag "${IMAGE}:${PRIMARY}" \
            "${flags[@]}" \
            "${cache[@]}" \
            --file "${CF_FILE}" .
      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman push --digestfile /tmp/digest_primary.txt "${IMAGE}:${PRIMARY}"
          echo "digest=$(cat /tmp/digest_primary.txt)" >> "$GITHUB_OUTPUT"
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        uses: DaemonCores/DaemonCores-CI/sign-image@main
        with:
          refs: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PASSWORD }}

  # Promote per-arch images into multi-arch manifest lists. Runs once all
  # build-test-push combos (variant x arch) are green.
  # For each variant tag V (a `-4k` tag covers arm64 only), the manifest job
  # creates :V -> :V_amd64 + :V_arm64, so `podman pull :latest` resolves to the
  # right arch on each host. The canonical amd64 image was also pushed on :latest
  # by build-test-push; this manifest job overwrites that single-arch tag with
  # the manifest list (the amd64 entry points at the same image, so amd64 pulls
  # are unchanged).
  manifest:
    name: Manifest lists ${{ matrix.entry.tag }}
    needs: [discover, build-test-push, build-iso]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.manifest_matrix) }}
    steps:
      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG || github.token }}
        run: |
          set -euo pipefail
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      - name: Create and push manifest lists
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          ARCHES: ${{ join(matrix.entry.arches, ' ') }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          # The architectures this tag was built for: both for a regular tag,
          # arm64 only for a `-4k` tag (a 4 KB arm64 kernel image has no amd64 twin).
          read -r -a arches <<<"${ARCHES}"

          # Create, annotate and push the manifest list over the per-arch tags
          # <CF_TAG>_<arch> pushed by build-test-push.
          list="${IMAGE}:${CF_TAG}"
          refs=()
          for arch in "${arches[@]}"; do
            refs+=("${IMAGE}:${CF_TAG}_${arch}")
          done
          docker manifest create "${list}" "${refs[@]}"
          for arch in "${arches[@]}"; do
            if [ "${arch}" = "arm64" ]; then
              docker manifest annotate --arch arm64 "${list}" \
                "${IMAGE}:${CF_TAG}_arm64"
            fi
          done
          docker manifest push "${list}"

      # Sign the manifest list itself: its digest is the SHA-256 of the raw
      # manifest bytes (not that of a per-arch entry).
      - name: Resolve manifest list digests
        id: lists
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          tags=("${CF_TAG}")
          {
            echo "refs<<EOF"
            for t in "${tags[@]}"; do
              digest=$(skopeo inspect --raw "docker://${IMAGE}:${t}" \
                | sha256sum | cut -d' ' -f1)
              echo "${IMAGE}@sha256:${digest}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sign manifest lists
        uses: DaemonCores/DaemonCores-CI/sign-image@main
        with:
          refs: ${{ steps.lists.outputs.refs }}
          private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          password: ${{ secrets.COSIGN_PASSWORD }}
