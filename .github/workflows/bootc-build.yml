name: Container Image CI

on:
  workflow_call:
    inputs:
      force_no_cache:
        description: 'Force a --no-cache image rebuild (e.g. a .deb changed).'
        type: boolean
        required: false
        default: false

jobs:
  # Discover every Containerfile* at the repo root and emit a FLAT build
  # matrix where each entry is { file, tag, arch, autoupdate }. The autoupdate
  # dimension is driven by the Containerfile itself: when the file carries
  # `LABEL org.daemoncores.autoupdate-variants` BOTH the autoupdate (1) and
  # lock (0) variants are emitted; when the LABEL is absent only the autoupdate
  # (1) variant is emitted. Both arches (amd64, arm64) are always included.
  # Also computes a global hash over all Containerfiles so any variant change
  # invalidates every variant's "identical to previous" cache.
  #
  # A second output, manifest_matrix, lists the unique variant tags with a
  # `lock` boolean telling the manifest job whether a _lock manifest list
  # should be produced for that tag.
  discover:
    name: Discover Containerfiles
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      manifest_matrix: ${{ steps.list.outputs.manifest_matrix }}
      global_hash: ${{ steps.list.outputs.global_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: List Containerfiles and build matrix
        id: list
        run: |
          set -euo pipefail
          # Find every Containerfile* at the repo root (maxdepth 1). Sorted for
          # deterministic ordering across runs.
          mapfile -t files < <(find . -maxdepth 1 -type f -name 'Containerfile*' \
            | sed 's|^\./||' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Containerfile found at repo root." >&2
            exit 1
          fi
          matrix='[]'
          manifest_matrix='[]'
          global_inputs=""
          for name in "${files[@]}"; do
            if [[ "$name" == "Containerfile" ]]; then
              tag="latest"
            else
              tag="${name#Containerfile.}"
            fi
            # Check for the autoupdate-variants LABEL. When present, the file
            # declares both autoupdate and lock variants; when absent, only
            # autoupdate is built (the default bootc behavior).
            if grep -qE '^[[:space:]]*LABEL[[:space:]]+org\.daemoncores\.autoupdate-variants' "$name"; then
              has_lock=true
              autoupdates=(1 0)
            else
              has_lock=false
              autoupdates=(1)
            fi
            for arch in amd64 arm64; do
              for au in "${autoupdates[@]}"; do
                matrix=$(printf '%s' "$matrix" | jq -c \
                  --arg file "$name" --arg tag "$tag" --arg arch "$arch" --argjson au "$au" \
                  '. += [{file: $file, tag: $tag, arch: $arch, autoupdate: $au}]')
              done
            done
            manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c \
              --arg tag "$tag" --argjson lock "$has_lock" \
              '. += [{tag: $tag, lock: $lock}]')
            global_inputs+="${name} $(sha256sum "$name" | cut -d' ' -f1)"$'\n'
          done
          global_hash=$(printf '%s' "$global_inputs" | sha256sum | cut -d' ' -f1)
          echo "matrix=$(printf '%s' "$matrix" | jq -c .)" >>"$GITHUB_OUTPUT"
          echo "manifest_matrix=$(printf '%s' "$manifest_matrix" | jq -c .)" >>"$GITHUB_OUTPUT"
          echo "global_hash=${global_hash}" >>"$GITHUB_OUTPUT"
          echo "Discovered build matrix:"
          printf '%s' "$matrix" | jq .
          echo "Manifest matrix:"
          printf '%s' "$manifest_matrix" | jq .
          echo "Global Containerfiles hash: ${global_hash}"

  build-test-push:
    name: Build ${{ matrix.entry.tag }}-${{ matrix.entry.arch }}-${{ matrix.entry.autoupdate == '1' && 'autoupdate' || 'lock' }}
    needs: discover
    runs-on: ${{ matrix.entry.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      # Lets the duplicate-image guard open/append a "suspicious pipeline" issue.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # Flat matrix: each entry is { file, tag, arch, autoupdate }. The
        # autoupdate dimension (1/0) is decided per-Containerfile in the discover
        # job based on the org.daemoncores.autoupdate-variants LABEL, and the
        # arch dimension (amd64/arm64) is folded in here. Both arches always
        # build natively on their matching runner (no QEMU cross-build).
        entry: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name and tags
        id: tags
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
          AUTOUPDATE: ${{ matrix.entry.autoupdate }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Suffix per autoupdate variant: 1 -> autoupdate, 0 -> lock.
          if [ "$AUTOUPDATE" = "1" ]; then autosuffix=autoupdate; else autosuffix=lock; fi
          # Per-arch per-autoupdate tag. The autoupdate variant carries the
          # suffix, the lock variant carries _lock. No device segment (the
          # kernel modules are now selected per-arch inside the Containerfile
          # instead of being a build dimension).
          primary="${CF_TAG}_${ARCH}_${autosuffix}"
          echo "primary=${primary}" >>"$GITHUB_OUTPUT"
          echo "autosuffix=${autosuffix}" >>"$GITHUB_OUTPUT"
          # Canonical combo = amd64 + autoupdate. Only this one keeps the
          # historical tags (:latest / :<sha> / :monthly-*) for retrocompat
          # with the single-arch era, so existing amd64 pulls/tags keep
          # working.
          canonical=false
          if [ "$ARCH" = "amd64" ] && [ "$AUTOUPDATE" = "1" ]; then canonical=true; fi
          echo "canonical=${canonical}" >>"$GITHUB_OUTPUT"
          echo "ARCH=${ARCH}" >>"$GITHUB_ENV"
          echo "AUTOUPDATE=${AUTOUPDATE}" >>"$GITHUB_ENV"
          echo "AUTOSUFFIX=${autosuffix}" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG }}
        run: |
          set -euo pipefail
          # Login Podman for build and push with podman fonctionality and for bootc standard
          sudo podman login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

          # Login Docker because github signe container with docker and not podman
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      # Deterministic content id of what actually goes into the image: the
      # published deb hashes + the base image digest (per-arch) + this variant's
      # Containerfile + the global Containerfiles hash + the arch + the
      # autoupdate variant. Stamped as a label so the next run can tell whether
      # a rebuild changed anything. The arch+autoupdate are part of the id so
      # cross-arch and lock/autoupdate variants get distinct cache identities.
      - name: Compute content hash
        id: chash
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          GLOBAL_HASH: ${{ needs.discover.outputs.global_hash }}
          ARCH: ${{ matrix.entry.arch }}
          AUTOUPDATE: ${{ matrix.entry.autoupdate }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 \
            || { sudo apt-get update -qq; sudo apt-get install -y skopeo; }
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          pages="https://${owner,,}.github.io/${repo}"
          debs=$(curl -fsSL "${pages}/debs-cache/hashes.json" 2>/dev/null \
            | jq -cS . 2>/dev/null || echo '{}')
          base=$(grep -m1 -iE '^FROM ' "$CF_FILE" | awk '{ print $2 }')
          # Resolve the base image's per-arch digest (--override-arch) so amd64
          # and arm64 get distinct, correct digests even when the base is a
          # multi-arch manifest list.
          base_digest=$(sudo skopeo inspect --override-arch "${ARCH}" \
            --format '{{.Digest}}' "docker://${base}" 2>/dev/null || echo none)
          cf=$(sha256sum "$CF_FILE" | cut -d' ' -f1)
          hash=$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "${debs}" "${base_digest}" "${cf}" "${GLOBAL_HASH}" "${CF_TAG}" \
            "${ARCH}" "${AUTOUPDATE}" \
            | sha256sum | cut -d' ' -f1)
          echo "hash=${hash}" >>"$GITHUB_OUTPUT"
          # Content-hash label of the currently published per-arch image.
          prior=$(sudo skopeo inspect --override-arch "${ARCH}" \
            --format '{{ index .Labels "org.daemoncores.content-hash" }}' \
            "docker://${IMAGE}:${PRIMARY}" 2>/dev/null || echo '')
          if [[ -n "${prior}" && "${prior}" == "${hash}" ]]; then
            echo "identical=true" >>"$GITHUB_OUTPUT"
          else
            echo "identical=false" >>"$GITHUB_OUTPUT"
          fi
          echo "content-hash=${hash} prior=${prior:-none} tag=${PRIMARY}"

      - name: Build
        env:
          CF_FILE: ${{ matrix.entry.file }}
          CF_TAG: ${{ matrix.entry.tag }}
          ARCH: ${{ matrix.entry.arch }}
          AUTOUPDATE: ${{ matrix.entry.autoupdate }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          CANONICAL: ${{ steps.tags.outputs.canonical }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ github.event_name }}" == "schedule" \
            || "${{ inputs.force_no_cache }}" == "true" ]]; then
            flags+=(--no-cache)
          fi
          # Monthly tag: 'monthly-YYYYMMDD' for the canonical latest combo only
          # (preserves the historical amd64-only monthly tag).
          if [[ "${{ github.event_name }}" == "schedule" && "$CANONICAL" == "true" ]]; then
            if [[ "$CF_TAG" == "latest" ]]; then
              flags+=(--tag "${IMAGE}:monthly-$(date -u +%Y%m%d)")
            else
              flags+=(--tag "${IMAGE}:${CF_TAG}-monthly-$(date -u +%Y%m%d)")
            fi
          fi

          # Product display name, derived automatically from the repo name (same
          # rule as the ISO branding: repo tail, dashes -> spaces). Passed into
          # the build so the image brands its UEFI boot-entry label with it
          # instead of a hardcoded distro name.
          product_name="${GITHUB_REPOSITORY##*/}"
          product_name="${product_name//-/ }"

          # SHA tag (retrocompat with the single-Containerfile era): bare '<sha>'
          # for latest canonical, '<tag>-<sha>' for non-latest canonical. Only the
          # canonical combo (amd64 + autoupdate) produces a SHA tag to preserve
          # the historical amd64 sha tag as a single-arch artifact.
          if [[ "$CANONICAL" == "true" ]]; then
            sha=$(git rev-parse --short HEAD)
            if [[ "$CF_TAG" == "latest" ]]; then
              flags+=(--tag "${IMAGE}:${sha}")
            else
              flags+=(--tag "${IMAGE}:${CF_TAG}-${sha}")
            fi
          fi

          # Canonical combo also keeps the bare :latest / :<variant> tag pointing
          # at the amd64 autoupdate image (retrocompat: an amd64 pull of :latest
          # gets the amd64 image directly, before the manifest list job promotes
          # it to a multi-arch manifest).
          if [[ "$CANONICAL" == "true" ]]; then
            flags+=(--tag "${IMAGE}:${CF_TAG}")
          fi

          # The Containerfile selects its kernel modules per-arch internally
          # (RUN if [ "${ARCH}" = "amd64" ]; then ... else ... fi), so the build
          # context is the same for every arch and the only build-args are
          # PRODUCT_NAME and AUTOUPDATE. No DEVICE build-arg anymore.
          sudo podman build \
            "${flags[@]}" \
            --build-arg "PRODUCT_NAME=${product_name}" \
            --build-arg "AUTOUPDATE=${AUTOUPDATE}" \
            --label "org.daemoncores.content-hash=${{ steps.chash.outputs.hash }}" \
            --tag "${IMAGE}:${PRIMARY}" \
            -f "$CF_FILE" \
            --format docker \
            .

      - name: Check runtime deps
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE}:${PRIMARY}" \
            sh -c "ldd /usr/bin/bootc && ldd /usr/lib/libostree-1.so*"

      - name: Smoke test
        env:
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          sudo podman run --rm "${IMAGE}:${PRIMARY}" bootc container lint

      # Real boot test: install to a disk, boot under QEMU/KVM, run the repo's
      # image-tests over SSH. A failure fails this job, so Push never runs.
      - name: Boot-test the image
        uses: DaemonCores/DaemonCores-CI/image-test@main
        with:
          image: ${{ env.IMAGE }}:${{ steps.tags.outputs.primary }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
          CANONICAL: ${{ steps.tags.outputs.canonical }}
        run: |
          set -euo pipefail
          # Per-arch per-autoupdate tag (always).
          sudo podman push --digestfile /tmp/digest_primary.txt "${IMAGE}:${PRIMARY}"
          echo "digest=$(cat /tmp/digest_primary.txt)" >> "$GITHUB_OUTPUT"
          # Canonical combo preserves the historical tags.
          if [[ "$CANONICAL" == "true" ]]; then
            sudo podman push "${IMAGE}:${CF_TAG}"
            sha=$(git rev-parse --short HEAD)
            if [[ "$CF_TAG" == "latest" ]]; then
              sudo podman push "${IMAGE}:${sha}"
            else
              sudo podman push "${IMAGE}:${CF_TAG}-${sha}"
            fi
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              if [[ "$CF_TAG" == "latest" ]]; then
                sudo podman push "${IMAGE}:monthly-$(date -u +%Y%m%d)"
              else
                sudo podman push "${IMAGE}:${CF_TAG}-monthly-$(date -u +%Y%m%d)"
              fi
            fi
          fi

      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Sign image
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      # The image was built, pushed and signed but its content is byte-identical
      # to what was already published (same debs + base + Containerfiles + arch
      # + autoupdate). Report it as a suspicious/wasteful run without failing
      # the pipeline. One issue per variant-arch-autoupdate combo (title keyed by
      # the primary tag) so each combo's status is visible.
      - name: Flag identical image
        if: github.ref == 'refs/heads/main' && steps.chash.outputs.identical == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIMARY: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          hash="${{ steps.chash.outputs.hash }}"
          {
            echo "### ⚠️ Image identique à la précédente (\`${PRIMARY}\`)"
            echo
            echo "Le pipeline a reconstruit, poussé **et signé** une image dont le"
            echo "content-hash \`${hash}\` est identique à celle déjà publiée (tag \`${PRIMARY}\`) :"
            echo "ni les .deb, ni l'image de base, ni les Containerfiles, ni l'arch/autoupdate n'ont changé."
            echo "Le rebuild/push/signature était probablement inutile."
          } >>"$GITHUB_STEP_SUMMARY"
          title="⚠️ Pipeline douteuse : image identique poussée (${PRIMARY})"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number -q '.[0].number' \
            2>/dev/null || true)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
              --body "Run \`${GITHUB_RUN_ID}\` : image identique (tag \`${PRIMARY}\`, hash \`${hash}\`)." \
              2>/dev/null || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Content-hash \`${hash}\` inchangé pour le tag \`${PRIMARY}\` mais image reconstruite, poussée et signée (run \`${GITHUB_RUN_ID}\`)." \
              2>/dev/null || true
          fi

  # Promote per-arch images into multi-arch manifest lists. Runs once all
  # build-test-push combos (variant x arch x autoupdate) are green.
  # For each variant tag V, the manifest job creates:
  #   :V            -> :V_amd64_autoupdate + :V_arm64_autoupdate  (always)
  #   :V_autoupdate -> :V_amd64_autoupdate + :V_arm64_autoupdate  (always)
  #   :V_lock       -> :V_amd64_lock     + :V_arm64_lock         (only when the
  #                  Containerfile declared org.daemoncores.autoupdate-variants)
  # The :latest (and bare :<variant>) tag stays a multi-arch manifest list over
  # the autoupdate variant, so `podman pull :latest` resolves to the right arch
  # on each host. The canonical amd64 autoupdate image was also pushed on :latest
  # by build-test-push; this manifest job overwrites that single-arch tag with
  # the manifest list (the amd64 entry points at the same image, so amd64 pulls
  # are unchanged).
  manifest:
    name: Manifest lists ${{ matrix.entry.tag }}
    needs: [discover, build-test-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.manifest_matrix) }}
    steps:
      - name: Log in to GHCR
        env:
          PAT_PKG: ${{ secrets.PAT_PKG }}
        run: |
          set -euo pipefail
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin <<< "${PAT_PKG}"

      - name: Create and push manifest lists
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          HAS_LOCK: ${{ matrix.entry.lock }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          # Per-arch per-autoupdate tags pushed by build-test-push.
          amd64_auto="${IMAGE}:${CF_TAG}_amd64_autoupdate"
          arm64_auto="${IMAGE}:${CF_TAG}_arm64_autoupdate"
          amd64_lock="${IMAGE}:${CF_TAG}_amd64_lock"
          arm64_lock="${IMAGE}:${CF_TAG}_arm64_lock"

          # :<tag> and :<tag>_autoupdate always present (multi-arch over the
          # autoupdate variant).
          docker manifest create "${IMAGE}:${CF_TAG}" \
            "${amd64_auto}" "${arm64_auto}"
          docker manifest annotate --arch arm64 "${IMAGE}:${CF_TAG}" "${arm64_auto}"
          docker manifest push "${IMAGE}:${CF_TAG}"

          docker manifest create "${IMAGE}:${CF_TAG}_autoupdate" \
            "${amd64_auto}" "${arm64_auto}"
          docker manifest annotate --arch arm64 "${IMAGE}:${CF_TAG}_autoupdate" "${arm64_auto}"
          docker manifest push "${IMAGE}:${CF_TAG}_autoupdate"

          # :<tag>_lock only when the Containerfile declared the autoupdate-
          # variants LABEL (i.e. it produces both lock and autoupdate builds).
          if [ "$HAS_LOCK" = "true" ]; then
            docker manifest create "${IMAGE}:${CF_TAG}_lock" \
              "${amd64_lock}" "${arm64_lock}"
            docker manifest annotate --arch arm64 "${IMAGE}:${CF_TAG}_lock" "${arm64_lock}"
            docker manifest push "${IMAGE}:${CF_TAG}_lock"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          install-dir: /usr/local/bin
          use-sudo: true

      - name: Sign manifest lists
        env:
          CF_TAG: ${{ matrix.entry.tag }}
          HAS_LOCK: ${{ matrix.entry.lock }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          tags=("${CF_TAG}" "${CF_TAG}_autoupdate")
          if [ "$HAS_LOCK" = "true" ]; then
            tags+=("${CF_TAG}_lock")
          fi
          for t in "${tags[@]}"; do
            digest=$(docker manifest inspect "${IMAGE}:${t}" \
              | jq -r '.manifests[0].digest // .config.digest // empty' \
              || true)
            # Fallback: skopeo inspect returns the manifest list digest.
            if [ -z "${digest}" ]; then
              digest=$(skopeo inspect --raw "docker://${IMAGE}:${t}" \
                | jq -r '.manifests[0].digest // empty' || true)
            fi
            if [ -n "${digest}" ]; then
              cosign sign --yes "${IMAGE}@${digest}"
            else
              echo "::warning::no digest found for ${IMAGE}:${t}, skipping sign"
            fi
          done