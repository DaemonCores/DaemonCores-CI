---
# PATCH SIBLING ELECTION registry (owner order 2026-11-10). A third-party
# patch that lives as SIBLINGS inside an upstream repository (a series the
# patch source re-bases per kernel series, or a lore mbox series re-sent as
# new versions) is ELECTED, never pinned by hand: the last (newest) commit
# whose patch bytes pass the fuzz-0 dry-run against the elected kernel tree
# wins, the elected blob sha256 is re-pinned into the manifest entry BY the
# re-probe (`upstream-track/sibling.sh`), and a sibling that fails is a
# documented K-PORT — never a reason to pin a kernel series.
#
# Schema per entry:
#   name      the patch entry name in `manifest`
#   manifest  patches.yml this election re-pins (path relative to the
#             engine root)
#   entry     the `patches:` entry the sha256 pin lands on
#   repo      the git repository the siblings live in (GitHub API reachable
#             for `history: github-commits`; a public-inbox lore mirror for
#             `history: git-log`)
#   history   candidate enumeration: `github-commits` (newest commits of the
#             default branch, `depth` window) or `git-log` (subjects matching
#             `subject`, message-id recovered from the public-inbox commit
#             blob, `/raw` mbox served by the gnuweeb mirror)
#   file      path of the patch file inside the repo ({series} = kernel
#             series) — `github-commits` only
#   series    the sibling series dir(s) to probe (github-commits only)
#   subject   the commit subject regex of the series (git-log only)
#   stages    the patches of ONE series verdict ordered by their [n/N]
#             index (git-log only): the whole sibling SET dry-runs in
#             series order
#   depth     commit window walked, newest first
siblings:
  - name: bore
    # BORE (owner: the CachyOS patch set): the sched sibling per series dir;
    # the election judges whether ANY sibling applies to the elected kernel
    # tree (it currently K-PORTs against vanilla 7.2/7.3 — the re-probe is
    # automatic, no manual re-arm).
    manifest: build-deb/kernel-shared/patches-shared.yml
    entry: bore
    repo: https://github.com/CachyOS/kernel-patches
    history: github-commits
    file: "{series}/sched/0001-bore-cachy.patch"
    series: ["7.3", "7.2"]
    depth: 15
  - name: bore-xanmod
    # BORE ALTERNATE SOURCE (owner order: the xanmod linux-patches GitLab set
    # is a legal second candidate carrier — alternate SIBLING of the same
    # `bore` entry, a candidate for the gate, never a local patch edit).
    # Repo layout facts (GitLab API + GitHub mirror tree walk, 2026-11-14):
    # the per-series topic dirs resolve as
    # `linux-<series>.y-xanmod/<topic>/<NNNN>-XANMOD-*.patch`, so the bore
    # sibling would live at the {file} path below. VERDICT (documented
    # K-PORT): the xanmod/linux-patches repo ships NO bore file AT ALL —
    # 0 path matching 'bore' in the full 2565-file tree, 7.2/7.3/eol
    # included — the probe therefore returns K-PORT ("no sibling") without
    # a single dry-run; the overall bore verdict stays K-PORT (CachyOS also
    # KO). xanmod vendors BORE inside its kernel source tree, not as a
    # standalone sched patch that any vanilla-tree dry-run could consume.
    # The election re-judges automatically: if xanmod ever publishes the
    # file at this path, the probe elects it and re-pins the `entry` blob.
    # An OK verdict here would ALSO need the manifest URL of the shared
    # `bore` entry swapped to the xanmod raw URL in the same pass (the pin
    # script writes sha256 only, never the url).
    manifest: build-deb/kernel-shared/patches-shared.yml
    entry: bore
    repo: https://github.com/xanmod/linux-patches
    history: github-commits
    file: "linux-{series}.y-xanmod/xanmod/0009-XANMOD-fair-bore.patch"
    series: ["7.3", "7.2"]
    depth: 5
  - name: msm-adreno-devfreq-ifpc
    # msm IFPC (owner mandate ARM OPTI 2026-11-09, feasibility item 6): the
    # devfreq [17/17] relax rides the [16/17] a6xx X1-85 enablement — the
    # whole lore series is the sibling set; candidates = the public-inbox
    # git mirror commits (gnuweeb), /raw mbox by message-id bare-curl.
    manifest: build-deb/kernel-shared/patches-shared.yml
    entry: msm-adreno-devfreq-ifpc
    repo: https://lore-kernel.gnuweeb.org/dri-devel/0
    history: git-log
    subject: "PATCH.*ifpc-support"
    stages: true
    depth: 400
