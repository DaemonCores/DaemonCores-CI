name: 'Ensure image signing key'
description: >-
  Makes sure the calling repository owns its cosign image signing key pair
  (COSIGN_PRIVATE_KEY / COSIGN_PASSWORD / COSIGN_PUBLIC_KEY secrets) and
  generates it once if absent. Requires a token with secrets:write
  (PAT_SECRETS); without it the pipeline falls back to keyless signing.

inputs:
  gh-token:
    description: 'PAT with secrets:write on the calling repository (PAT_SECRETS).'
    required: false
    default: ''

outputs:
  created:
    description: 'yes when the key pair was generated by this step.'
    value: ${{ steps.ensure.outputs.created }}

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@v3
      with:
        cosign-release: v2.6.5
    - id: ensure
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: ${{ github.action_path }}/../scripts/ensure-cosign-key.sh
