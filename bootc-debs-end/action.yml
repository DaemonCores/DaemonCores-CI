name: 'Bootc Debs End'
description: 'Publish bootc debs to GitHub Pages as an APT repo (checkout, download-artifact, create-apt-repo, deploy-pages with retries)'

inputs:
  repo_name:
    description: 'Name of the APT repository published on GitHub Pages'
    required: true
  apt_gpg_key:
    description: 'GPG private key used to sign the APT repository (passed by caller from secrets.APT_GPG_KEY)'
    required: true
  skip_pages:
    description: 'Set to true to skip the GitHub Pages upload and deploy steps (used when another job handles deployment).'
    required: false
    default: 'false'

  carry_over:
    description: 'Set to true when the build job did not finish cleanly: packages absent from the artifact are kept from the published site instead of dropped.'
    required: false
    default: 'false'

outputs:
  any_rebuilt:
    description: 'true if at least one package was rebuilt (not cache-reused).'
    value: ${{ steps.rebuilt.outputs.any_rebuilt }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
    # Each package uploads its own artifact debs-<pkg>-<arch>. They are kept in
    # separate directories: an arch-independent package is uploaded by both
    # architectures under one file name, and merging at download time mixes the
    # two builds into one corrupt file.
    - uses: actions/download-artifact@v8
      with:
        pattern: debs-*
        path: debs-in/

    - name: Merge the artifacts and verify every deb
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/merge-artifacts.sh"

    - name: Keep the packages this run did not refresh
      if: ${{ inputs.carry_over == 'true' }}
      shell: bash
      run: |
        command -v jq >/dev/null 2>&1 \
          || { sudo apt-get update >/dev/null; sudo apt-get install -y jq >/dev/null; }
        bash "${GITHUB_ACTION_PATH}/carry-over.sh"

    - name: Compute any_rebuilt
      id: rebuilt
      shell: bash
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 \
          || { apt-get update >/dev/null; apt-get install -y jq >/dev/null; }
        any=false
        shopt -s nullglob
        for m in debs/.meta/*.json; do
          if [ "$(jq -r .skipped "$m")" = "false" ]; then
            any=true
            break
          fi
        done
        echo "any_rebuilt=${any}" >>"$GITHUB_OUTPUT"
        echo "any_rebuilt=${any}"

    - name: Install reprepro
      shell: bash
      run: |
        command -v reprepro >/dev/null 2>&1 \
          || { sudo apt-get update >/dev/null; sudo apt-get install -y --no-install-recommends reprepro >/dev/null; }
        # Wrap reprepro so --ignore=unknownfield is always passed: the
        # distributions config generated by apt-repo-action may include fields
        # (e.g. Limit) not known to the apt-installed reprepro version.
        # /usr/local/bin comes before /usr/bin in PATH, so the action picks up
        # the wrapper without any change to the action itself.
        real=$(command -v reprepro)
        printf '#!/bin/sh\nexec %s --ignore=unknownfield "$@"\n' "$real" \
          | sudo tee /usr/local/bin/reprepro >/dev/null
        sudo chmod +x /usr/local/bin/reprepro

    - name: Create APT repo
      id: create-apt-repo
      uses: morph027/apt-repo-action@v3
      with:
        repo-name: ${{ inputs.repo_name }}
        signing-key: ${{ inputs.apt_gpg_key }}
        codename: trixie
        components: main
        architectures: amd64 arm64

    # Publish the content-addressed deb cache alongside the APT repo so the
    # build-deb action can reuse unchanged packages on the next run:
    #   debs-cache/<pkg>_<ver>_<arch>.deb   flat copies for direct download
    #   debs-cache/hashes.json              per-package {hash, debs}
    # apt clients only read dists/ and pool/, so this extra folder is inert.
    - name: Assemble deb cache
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 \
          || { apt-get update >/dev/null; apt-get install -y jq >/dev/null; }
        cache="${REPO_DIR}/debs-cache"
        mkdir -p "${cache}"
        find debs -maxdepth 1 -name '*.deb' -exec cp {} "${cache}/" \; 2>/dev/null \
          || true
        out="${cache}/hashes.json"
        # SEED from the published map (monotonic cache): a run that only
        # rebuilds a subset must NOT drop the other packages' entries, or
        # the next run loses its prior hashes and rebuilds everything
        # (the union-era 2h-loop: every run rebuilt all kernels because
        # the map was reset to {} then pruned).
        owner="${GITHUB_REPOSITORY%%/*}"
        prior_url="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/debs-cache/hashes.json"
        [[ -n "${PAGES_URL:-}" ]] && prior_url="${PAGES_URL%/}/debs-cache/hashes.json"
        curl -fsSL "${prior_url}" -o "${out}" 2>/dev/null \
          || echo '{}' >"${out}"
        jq -e 'type == "object"' "${out}" >/dev/null 2>&1 \
          || echo '{}' >"${out}"
        # /debs/.meta/<pkg>.json is written by the build-deb action per package.
        shopt -s nullglob
        for meta in debs/.meta/*.json; do
          pkg=$(basename "${meta}" .json)
          jq --arg p "${pkg}" --slurpfile m "${meta}" \
            '. + {($p): {hash: $m[0].hash, debs: $m[0].debs}}' \
            "${out}" >"${out}.n"
          mv "${out}.n" "${out}"
        done
        echo "debs-cache: $(jq 'keys | length' "${out}") package(s) recorded"

    # The SBOM of the election (the selection.log records the track/sibling
    # security gates wrote, merged into .meta) + the per-variant changelog:
    # both files land at the Pages root next to the APT repo.
    - name: Assemble the election SBOM + changelog
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
      run: |
        set -euo pipefail
        DEBS_DIR="debs" OUT_DIR="${REPO_DIR}" \
          bash "${GITHUB_ACTION_PATH}/sbom.sh"

    - name: Clean stale deb cache
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
      run: |
        cache="${REPO_DIR}/debs-cache"
        hashes="${cache}/hashes.json"
        for deb in "${cache}"/*.deb; do
          basename=$(basename "${deb}")
          if ! jq -e --arg f "${basename}" '[.[].debs[]?] | index($f)' "${hashes}" >/dev/null 2>&1; then
            rm -f "${deb}"
          fi
        done

    - name: Drop the stale github-pages artifact of this run
      # deploy-pages refuses when the run carries MORE THAN ONE github-pages
      # artifact. A re-run of the failed jobs (--failed) keeps the artifact
      # the first attempt uploaded, so the second attempt's upload makes
      # count 2 and deploy-pages dies ("Artifact count is 2"). upload-pages-
      # artifact only replaces an artifact it created in the same job
      # attempt — a previous attempt's one survives. Deleting every
      # existing github-pages artifact of the run here makes the deploy
      # idempotent across attempts. Requires actions: write on the job.
      if: ${{ inputs.skip_pages != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        api="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
        for id in $(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${api}" | jq -r '.artifacts[]? | select(.name == "github-pages") | .id'); do
          echo "deleting stale github-pages artifact ${id}"
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api}/${id}"
        done || {
          echo "::warning::stale github-pages artifact cleanup failed (missing actions:write?)"
        }

    - name: Upload Pages artifact
      if: ${{ inputs.skip_pages != 'true' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.create-apt-repo.outputs.dir }}

    # GitHub Pages deployments fail intermittently with "Deployment failed,
    # try again later." due to transient issues on the Pages service side
    # (see actions/deploy-pages issues #406 and #418). The error occurs
    # immediately after deployment creation, before any syncing status, and
    # is not caused by artifact conflicts, size, or workflow configuration.
    # Retrying within the same run (after a short backoff) reliably succeeds.
    - name: Deploy to GitHub Pages (attempt 1/3)
      id: deploy_1
      if: ${{ inputs.skip_pages != 'true' }}
      continue-on-error: true
      uses: actions/deploy-pages@v5

    - name: Wait before retry 2
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' }}
      shell: bash
      run: sleep 30

    - name: Deploy to GitHub Pages (attempt 2/3)
      id: deploy_2
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/deploy-pages@v5

    - name: Wait before retry 3
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
      shell: bash
      run: sleep 60

    - name: Deploy to GitHub Pages (attempt 3/3)
      id: deploy_3
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
      uses: actions/deploy-pages@v5

    - name: Fail job if all deploy attempts failed
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::All 3 GitHub Pages deploy attempts failed. This is a transient issue on the GitHub Pages service side; re-run the workflow later."
        exit 1