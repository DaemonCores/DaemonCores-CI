name: 'Bootc Debs End'
description: 'Publish bootc debs to GitHub Pages as an APT repo (checkout, download-artifact, create-apt-repo, deploy-pages with retries)'

inputs:
  repo_name:
    description: 'Name of the APT repository published on GitHub Pages'
    required: true
  apt_gpg_key:
    description: 'GPG private key used to sign the APT repository (passed by caller from secrets.APT_GPG_KEY)'
    required: true
  skip_pages:
    description: 'Set to true to skip the GitHub Pages upload and deploy steps (used when another job handles deployment).'
    required: false
    default: 'false'
  nosign_variant:
    description: >-
      `yes` to also publish the unsigned variant of a `both` signing run: the
      debs-*-<arch>-nosign artifacts become the suite trixie-nosign (component
      nosign) of the same repository, with their own deb cache folder
      debs-cache-nosign.
    required: false
    default: 'no'

outputs:
  any_rebuilt:
    description: 'true if at least one package was rebuilt (not cache-reused).'
    value: ${{ steps.rebuilt.outputs.any_rebuilt }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v7
    # Each package uploads its own artifact debs-<pkg>-<arch>; merge them all
    # into debs/. The suffixed unsigned-variant artifacts (-nosign) are not
    # matched here: they go to debs-nosign/ below.
    - uses: actions/download-artifact@v8
      with:
        pattern: debs-*-amd64
        merge-multiple: true
        path: debs/
    - uses: actions/download-artifact@v8
      with:
        pattern: debs-*-arm64
        merge-multiple: true
        path: debs/
    - if: ${{ inputs.nosign_variant == 'yes' }}
      uses: actions/download-artifact@v8
      with:
        pattern: debs-*-amd64-nosign
        merge-multiple: true
        path: debs-nosign/
    - if: ${{ inputs.nosign_variant == 'yes' }}
      uses: actions/download-artifact@v8
      with:
        pattern: debs-*-arm64-nosign
        merge-multiple: true
        path: debs-nosign/

    - name: Compute any_rebuilt
      id: rebuilt
      shell: bash
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 \
          || { apt-get update >/dev/null; apt-get install -y jq >/dev/null; }
        any=false
        shopt -s nullglob
        for m in debs/.meta/*.json debs-nosign/.meta/*.json; do
          if [ "$(jq -r .skipped "$m")" = "false" ]; then
            any=true
            break
          fi
        done
        echo "any_rebuilt=${any}" >>"$GITHUB_OUTPUT"
        echo "any_rebuilt=${any}"

    - name: Create APT repo
      id: create-apt-repo
      uses: morph027/apt-repo-action@v3
      with:
        repo-name: ${{ inputs.repo_name }}
        signing-key: ${{ inputs.apt_gpg_key }}
        codename: trixie
        components: main
        architectures: amd64 arm64

    # Unsigned variant of a both run: a second suite in the same repository
    # (dists/trixie-nosign, pool/nosign) so a client picks the signed or the
    # unsigned kernel and modules by its sources, never by version.
    - name: Create the unsigned APT suite
      id: nosign-apt-repo
      if: ${{ inputs.nosign_variant == 'yes' }}
      uses: morph027/apt-repo-action@v3
      with:
        repo-name: ${{ inputs.repo_name }}
        signing-key: ${{ inputs.apt_gpg_key }}
        scan-dir: debs-nosign
        codename: trixie-nosign
        components: nosign
        architectures: amd64 arm64

    - name: Merge the unsigned suite into the repository
      if: ${{ inputs.nosign_variant == 'yes' }}
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
        NOSIGN_DIR: ${{ steps.nosign-apt-repo.outputs.dir }}
      run: |
        set -euo pipefail
        # Both runs may share one output directory; then nothing to merge.
        if [ "$(realpath "${NOSIGN_DIR}")" != "$(realpath "${REPO_DIR}")" ]; then
          cp -a "${NOSIGN_DIR}/dists/trixie-nosign" "${REPO_DIR}/dists/"
          mkdir -p "${REPO_DIR}/pool"
          cp -a "${NOSIGN_DIR}/pool/nosign" "${REPO_DIR}/pool/"
        fi
        # Deb cache of the unsigned variant: its own folder, since the file
        # names are the same as the signed ones.
        cache="${REPO_DIR}/debs-cache-nosign"
        mkdir -p "${cache}"
        find debs-nosign -maxdepth 1 -name '*.deb' -exec cp {} "${cache}/" \;
        out="${cache}/hashes.json"
        echo '{}' >"${out}"
        shopt -s nullglob
        for meta in debs-nosign/.meta/*.json; do
          pkg=$(basename "${meta}" .json)
          jq --arg p "${pkg}" --slurpfile m "${meta}" \
            '. + {($p): {hash: $m[0].hash, debs: $m[0].debs}}' \
            "${out}" >"${out}.n"
          mv "${out}.n" "${out}"
        done
        for deb in "${cache}"/*.deb; do
          if ! jq -e --arg f "$(basename "${deb}")" '[.[].debs[]?] | index($f)' "${out}" >/dev/null 2>&1; then
            rm -f "${deb}"
          fi
        done
        echo "debs-cache-nosign: $(jq 'keys | length' "${out}") package(s) recorded"
        test -f "${REPO_DIR}/dists/trixie-nosign/Release"

    # Publish the content-addressed deb cache alongside the APT repo so the
    # build-deb action can reuse unchanged packages on the next run:
    #   debs-cache/<pkg>_<ver>_<arch>.deb   flat copies for direct download
    #   debs-cache/hashes.json              per-package {hash, debs}
    # apt clients only read dists/ and pool/, so this extra folder is inert.
    - name: Assemble deb cache
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
      run: |
        set -euo pipefail
        command -v jq >/dev/null 2>&1 \
          || { apt-get update >/dev/null; apt-get install -y jq >/dev/null; }
        cache="${REPO_DIR}/debs-cache"
        mkdir -p "${cache}"
        find debs -maxdepth 1 -name '*.deb' -exec cp {} "${cache}/" \; 2>/dev/null \
          || true
        out="${cache}/hashes.json"
        echo '{}' >"${out}"
        # /debs/.meta/<pkg>.json is written by the build-deb action per package.
        shopt -s nullglob
        for meta in debs/.meta/*.json; do
          pkg=$(basename "${meta}" .json)
          jq --arg p "${pkg}" --slurpfile m "${meta}" \
            '. + {($p): {hash: $m[0].hash, debs: $m[0].debs}}' \
            "${out}" >"${out}.n"
          mv "${out}.n" "${out}"
        done
        echo "debs-cache: $(jq 'keys | length' "${out}") package(s) recorded"

    - name: Clean stale deb cache
      shell: bash
      env:
        REPO_DIR: ${{ steps.create-apt-repo.outputs.dir }}
      run: |
        cache="${REPO_DIR}/debs-cache"
        hashes="${cache}/hashes.json"
        for deb in "${cache}"/*.deb; do
          basename=$(basename "${deb}")
          if ! jq -e --arg f "${basename}" '[.[].debs[]?] | index($f)' "${hashes}" >/dev/null 2>&1; then
            rm -f "${deb}"
          fi
        done

    - name: Upload Pages artifact
      if: ${{ inputs.skip_pages != 'true' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ steps.create-apt-repo.outputs.dir }}

    # GitHub Pages deployments fail intermittently with "Deployment failed,
    # try again later." due to transient issues on the Pages service side
    # (see actions/deploy-pages issues #406 and #418). The error occurs
    # immediately after deployment creation, before any syncing status, and
    # is not caused by artifact conflicts, size, or workflow configuration.
    # Retrying within the same run (after a short backoff) reliably succeeds.
    - name: Deploy to GitHub Pages (attempt 1/3)
      id: deploy_1
      if: ${{ inputs.skip_pages != 'true' }}
      continue-on-error: true
      uses: actions/deploy-pages@v5

    - name: Wait before retry 2
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' }}
      shell: bash
      run: sleep 30

    - name: Deploy to GitHub Pages (attempt 2/3)
      id: deploy_2
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/deploy-pages@v5

    - name: Wait before retry 3
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
      shell: bash
      run: sleep 60

    - name: Deploy to GitHub Pages (attempt 3/3)
      id: deploy_3
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' }}
      uses: actions/deploy-pages@v5

    - name: Fail job if all deploy attempts failed
      if: ${{ inputs.skip_pages != 'true' && steps.deploy_1.outcome == 'failure' && steps.deploy_2.outcome == 'failure' && steps.deploy_3.outcome == 'failure' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::All 3 GitHub Pages deploy attempts failed. This is a transient issue on the GitHub Pages service side; re-run the workflow later."
        exit 1