        stage: common
      - name: 0012-vfs-cache-pressure
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0012-XANMOD-vfs-Decrease-rate-at-which-vfs-caches-are-rec.patch
        topic: xanmod
        stage: common
      - name: 0013-mm-max-map-count
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0013-XANMOD-mm-Raise-max_map_count-default-value.patch
        topic: xanmod
        stage: common
      - name: 0014-mm-vmscan-swappiness
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0014-XANMOD-mm-vmscan-Reduce-amount-of-swapping.patch
        topic: xanmod
