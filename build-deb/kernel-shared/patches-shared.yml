---
# shared kernel patch data — the CANONICAL patch list BOTH kernel lanes
# consume. PATCH PARITY (owner arbitration 2026-11-03 12:30): the data lives
# HERE, in the build engine (build-deb/kernel-shared/), beside the helpers it
# feeds: build-deb.sh exports its directory as CI_KERNEL_SHARED (content
# hashed like the helper scripts) and both lanes consume the set from that
# checkout — the debian linux-image build (packages.yml linux-image) applies
# the manifest file-mode in addition to its own anchor patches; the PVE
# kernel build (DaemonCores-VE) applies the same manifest resolved by the
# REAL kernel version of the packaging tree. One list, two consumers, no
# copy in either consumer repo, no fetch between production repositories.
# {seriesdir}/{topic} placeholders resolve inside kernel_patch_list
# (DaemonCores-CI): each lane resolves its own kernel series (the PVE
# packaging carries a Debian 6.12.x kernel tree — the series resolves by
# that tree's Makefile, not by the 7.0.x packaging version). Source
# reviewed 2026-10-29: 17 xanmod + 3 clearlinux entries + bore (which
# travels with the shared set so the SCHED_BORE pin of
# kconfig/x86-common.cfg resolves on both kernels);
# 0004-ata-before-graphics removed (does not apply to the consumer trees);
# 0003-kbuild-sms-pipelining retired (dry-run fails on both series
# variants). A patch that cannot be downloaded or applied fails the
# consumer build (dry-run all-or-nothing).
patches:
      - name: 0001-x86-cflags
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0001-XANMOD-x86-build-Add-more-CFLAGS-optimizations.patch
        topic: xanmod
        stage: common
      # 0002-kbuild-llvm-plo: PINNED to the active 7.3 file: the EOL 7.0
      # sibling does not apply to the 7.0.x tree; the absolute URL keeps a
      # series bump from silently moving it.
      - name: 0002-kbuild-llvm-plo
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/linux-7.3.y-xanmod/xanmod/0002-XANMOD-kbuild-Add-LLVM-polyhedral-loop-optimizer-fla.patch
        topic: xanmod
        stage: common
      - name: 0004-kbuild-debpkg-dbg
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0004-XANMOD-kbuild-deb-pkg-Create-dbg-when-make-DEB_DEBUG.patch
        topic: xanmod
        stage: common
      - name: 0005-kbuild-sign-external-cfg
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0005-kbuild-Re-add-.config-file-required-to-sign-external.patch
        topic: xanmod
        stage: common
      - name: 0006-fair-unscaled-tunables
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0006-XANMOD-fair-Set-scheduler-tunable-latencies-to-unsca.patch
        topic: xanmod
        stage: common
      - name: 0007-mq-deadline-write-prio
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0007-XANMOD-block-mq-deadline-Increase-write-priority-to-.patch
        topic: xanmod
        stage: common
      - name: 0008-mq-deadline-front-merges
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0008-XANMOD-block-mq-deadline-Disable-front_merges-by-def.patch
        topic: xanmod
        stage: common
      - name: 0009-block-rq-affinity
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0009-XANMOD-block-Set-rq_affinity-to-force-complete-I-O-r.patch
        topic: xanmod
        stage: common
      - name: 0010-blk-wbt-latency
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0010-XANMOD-blk-wbt-Set-wbt_default_latency_nsec-to-2msec.patch
        topic: xanmod
        stage: common
      - name: 0011-kconfig-500hz
        url: https://gitlab.com/xanmod/linux-patches/-/raw/master/{seriesdir}/{topic}/0011-XANMOD-kconfig-add-500Hz-timer-interrupt-kernel-conf.patch
