name: 'Build all bootc .debs'
description: >-
  Build every package of the expanded manifest for one architecture in the
  current job (kernel packages first, then dependency order), via
  build-deb/build-all.sh. Needs the workspace checked out and /debs prepared
  (bootc-debs-start). Fails when any package build failed, after all packages
  were attempted.

inputs:
  manifest:
    description: 'Expanded manifest (output of manifest-expand).'
    required: true
  source-manifest:
    description: 'Path to the source manifest in the caller workspace (used to resolve upstream tracking).'
    required: false
    default: workflows/bootc-debs-builder/packages.yml
  arch:
    description: 'Target architecture (amd64 or arm64).'
    required: true
  signing-active:
    description: 'yes to sign .ko files; empty/no to skip.'
    required: false
    default: 'no'

outputs:
  any_built:
    description: 'true if at least one package was really built (not reused).'
    value: ${{ steps.run.outputs.any_built }}

runs:
  using: 'composite'
  steps:
    - name: Build all packages
      id: run
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        SIGNING_ACTIVE: ${{ inputs.signing-active }}
        MANIFEST: ${{ inputs.manifest }}
        SOURCE_MANIFEST: ${{ inputs.source-manifest }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../build-deb/build-all.sh" \
          "${MANIFEST}" "${SOURCE_MANIFEST}"
