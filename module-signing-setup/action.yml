name: 'Setup module signing'
description: >-
  Determines whether module signing is active for this run, and ensures the
  persistent MODULE_SIGNING_KEY / MODULE_SIGNING_CERT GitHub secrets exist,
  creating them (once) if absent. Requires a token with secrets:write on the
  repository (GITHUB_TOKEN is insufficient — use a PAT stored as PAT_SECRETS
  with `repo` scope or fine-grained `secrets:write` permission).

inputs:
  mode:
    description: 'Effective signing mode: nosign | sign | both. Derived from config.yml + dispatch override.'
    required: true
  gh-token:
    description: 'PAT with secrets:write on the calling repository (PAT_SECRETS).'
    required: true

outputs:
  active:
    description: 'yes when signing should run this build; no otherwise.'
    value: ${{ steps.decide.outputs.active }}

runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set -euo pipefail

        case "${MODE}" in
          sign|both) active=yes ;;
          *)         active=no  ;;
        esac

        if [ "${active}" = "yes" ]; then
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::sign_modules is active but PAT_SECRETS is not set." \
              "Create a PAT with secrets:write (fine-grained) or repo scope" \
              "(classic) and store it as PAT_SECRETS to enable auto key creation."
            active=no
          else
            # Check whether the persistent signing key already exists.
            http_status=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/secrets/MODULE_SIGNING_KEY" \
              -i 2>&1 \
              | head -1 | grep -oE '[0-9]{3}' | head -1 || echo 000)

            if [ "${http_status}" = "200" ]; then
              echo "MODULE_SIGNING_KEY exists — signing active" >&2
            elif [ "${http_status}" = "404" ]; then
              echo "MODULE_SIGNING_KEY absent — generating persistent keypair" >&2
              openssl req -new -x509 -newkey rsa:4096 \
                -keyout /tmp/mod_sign.pem \
                -out /tmp/mod_sign.x509 \
                -days 36500 -nodes \
                -subj "/CN=Module Signing Key/O=${GITHUB_REPOSITORY}/OU=CI"
              if gh secret set MODULE_SIGNING_KEY < /tmp/mod_sign.pem \
              && gh secret set MODULE_SIGNING_CERT < /tmp/mod_sign.x509; then
                rm -f /tmp/mod_sign.pem /tmp/mod_sign.x509
                # Secret just created: GitHub needs a new job start to surface it
                # to sibling jobs. Signing is active from the next run.
                echo "::notice::Module signing key created. Signing active from next CI run."
                active=no
              else
                rm -f /tmp/mod_sign.pem /tmp/mod_sign.x509
                echo "::error::Failed to write MODULE_SIGNING_KEY secret. The token" \
                  "passed as gh-token needs secrets:write scope (classic PAT with" \
                  "'repo' scope, or fine-grained PAT with 'secrets:write')." \
                  "Store it as PAT_SECRETS."
                exit 1
              fi
            else
              echo "::error::Unexpected HTTP ${http_status} from GitHub secrets API." >&2
              exit 1
            fi
          fi
        fi

        echo "active=${active}" >> "$GITHUB_OUTPUT"
